  for (var i=0;i<ruoli.length;i++) {
    var r = ruoli[i];
    if (sq[r] && sq[r][nome]) return sq[r][nome];
  }
  return null;
}
function aggiornaAmmonizione(sqId, nome, d) {
  var g = getGiocatoreAmm(sqId, nome); if (!g) return;
  g.gialli += d;
  if (g.gialli >= 2) g.squalificato = true;
}
function resetSqualificheDopoPartita(sqGiocata) {
  var sqId = sqGiocata;
  if (!ammonizioniCampionato.squadre[sqId]) return;
  var sq = ammonizioniCampionato.squadre[sqId];
  var ruoli = ['portiere','difensori','centrocampisti','difensori_alta','panchina'];
  for (var i=0;i<ruoli.length;i++) {
    var r = ruoli[i]; if (!sq[r]) continue;
    var nomi = Object.keys(sq[r]);
    for (var n=0;n<nomi.length;n++) {
      var g = sq[r][nomi[n]];
      if (g.squalificato) { g.gialli = 0; g.squalificato = false; }
    }
  }
}
function esportaAmmonizioniDaSerieA() {
  var data = new Date().toISOString().slice(0,10);
  var nomeFile = 'ammonizioni_' + data + '.json';
  var blob = new Blob([JSON.stringify(ammonizioniCampionato, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = nomeFile;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importaAmmonizioniDaFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var dati = JSON.parse(e.target.result);
      if (!dati.squadre) { alert('File non valido: manca il campo "squadre"'); return; }
      ammonizioniCampionato = dati;
      salvaAmmonizioni();
      alert('✅ Ammonizioni importate con successo!');
      renderAmmonizioniLista();
    } catch(err) { alert('Errore nel parsing del file: ' + err.message); }
  };
  reader.readAsText(file);
}
function resetAmmonizioniDaSerieA() {
  if (!confirm('Sei sicuro di voler azzerare TUTTE le ammonizioni? Questa azione è irreversibile.')) return;
  ammonizioniCampionato = inizializzaAmmonizioniVuote();
  salvaAmmonizioni();
  alert('✅ Ammonizioni azzerate');
  renderAmmonizioniLista();
}
function apriGestioneAmmonizioni() {
  document.getElementById('modale-ammonizioni').classList.remove('nascosto');
  renderAmmonizioniLista();
}
function chiudiModaleAmmonizioni() {
  document.getElementById('modale-ammonizioni').classList.add('nascosto');
}
function gestisciFileAmmSerieA(ev) {
  var f = ev.target.files[0]; if (!f) return;
  importaAmmonizioniDaFile(f);
  ev.target.value = '';
}
function renderAmmonizioniLista() {
  var cont = document.getElementById('ammonizioni-contenuto');
  if (!cont) return;
  var html = '<div class="ammonizioni-lista">';
  var keys = Object.keys(ammonizioniCampionato.squadre);
  for (var i=0;i<keys.length;i++) {
    var sqId = keys[i];
    var sqNome = SQUADRE[sqId] ? SQUADRE[sqId].nome : sqId;
    var sq = ammonizioniCampionato.squadre[sqId];
    var haAm = false, righe = '';
    var ruoli = ['portiere','difensori','centrocampisti','difensori_alta','panchina'];
    for (var r=0;r<ruoli.length;r++) {
      var ruolo = ruoli[r]; if (!sq[ruolo]) continue;
      var nomi = Object.keys(sq[ruolo]);
      for (var n=0;n<nomi.length;n++) {
        var g = sq[ruolo][nomi[n]];
        if (g.gialli > 0 || g.squalificato) {
          haAm = true;
          var cls = g.squalificato ? 'squalificato' : 'ammonito';
          righe += '<div class="giocatore ' + cls + '"><span>' + nomi[n] + '</span><span>' +
            (g.squalificato ? '🚫 SQUALIFICATO' : '🟨 ' + g.gialli) + '</span></div>';
        }
      }
    }
    if (haAm) html += '<div class="squadra-titolo">' + sqNome + '</div>' + righe;
  }
  if (html === '<div class="ammonizioni-lista">') {
    html += '<div style="text-align:center;color:#aaa;padding:20px">Nessuna ammonizione registrata</div>';
  }
  html += '</div>';
  cont.innerHTML = html;
}

/* SIMULAZIONE AMMONIZIONI */
function simulaAmmonizioniPartita(sqCasaId, sqTrasfId) {
  var sqIds = [sqCasaId, sqTrasfId];
  for (var s=0;s<sqIds.length;s++) {
    var sqId = sqIds[s];
    var rosa = ROSE[sqId]; if (!rosa) continue;
    var giocatori = [];
    if (rosa.portiere[0]) giocatori.push(rosa.portiere[0]);
    for (var d=0;d<rosa.difensori.length;d++) giocatori.push(rosa.difensori[d]);
    for (var c=0;c<rosa.centrocampisti.length;c++) giocatori.push(rosa.centrocampisti[c]);
    for (var da=0;da<rosa.difensori_alta.length;da++) giocatori.push(rosa.difensori_alta[da]);
    if (Math.random() < 0.30) {
      var nG = Math.random() < 0.75 ? 1 : 2;
      for (var g=0;g<nG;g++) {
        var gio = giocatori[Math.floor(Math.random()*giocatori.length)];
        aggiornaAmmonizione(sqId, gio, 1);
      }
    }
  }
}

/* CLASSIFICA */
function getClassifica() {
  const tab = {};
  SQUADRE_ORDINE.forEach(sq => tab[sq] = { squadra:sq, punti:0, giocate:0, vinte:0, pareggi:0, perse:0, gf:0, gs:0, dr:0 });
  for (const key in stato.risultati) {
    const r = stato.risultati[key];
    if (!r) continue;
    const parti = key.split('_');
    const g = parseInt(parti[0].substring(1));
    const idx = parseInt(parti[1]);
    const giornata = CALENDARIO_SERIEA[g - 1];
    if (!giornata) continue;
    const partita = giornata[idx];
    if (!partita) continue;
    const casa = normalizzaNome(partita.homeTeam);
    const trasf = normalizzaNome(partita.awayTeam);
    const c = tab[casa], t = tab[trasf];
    if (!c || !t) continue;
    const gc = r[0], gt = r[1];
    c.giocate++; t.giocate++;
    c.gf += gc; c.gs += gt;
    t.gf += gt; t.gs += gc;
    if (gc > gt) { c.punti += 3; c.vinte++; t.perse++; }
    else if (gc < gt) { t.punti += 3; t.vinte++; c.perse++; }
    else { c.punti++; t.punti++; c.pareggi++; t.pareggi++; }
    c.dr = c.gf - c.gs;
    t.dr = t.gf - t.gs;
  }
  return Object.values(tab).sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

/* SIMULAZIONE */
const FORZA = {
  inter:90, milan:88, juventus:87, napoli:86, roma:84, lazio:82, atalanta:85,
  fiorentina:80, bologna:78, torino:74, udinese:72, genoa:70, cagliari:68,
  como:66, parma:64, monza:63, frosinone:60, venezia:58, lecce:62, sassuolo:61
};
function forza(id) { return FORZA[id] || 65; }
function simula(a, b) {
  const fa = forza(a), fb = forza(b);
  const pa = fa / (fa + fb);
  const ga = Math.random() < pa ? Math.floor(Math.random()*4) : Math.floor(Math.random()*2);
  const gb = Math.random() < (1-pa) ? Math.floor(Math.random()*4) : Math.floor(Math.random()*2);
  return [ga, gb];
}

/* ============================================================
   MARCATORI
   ============================================================ */
function aggiungiMarcatoriPartita(sqCasaId, sqTrasfId, golCasa, golTrasf) {
  if (!stato.marcatori) stato.marcatori = {};
  marcatorePerSquadra(sqCasaId, golCasa);
  marcatorePerSquadra(sqTrasfId, golTrasf);
}

function marcatorePerSquadra(sqId, nGol) {
  if (nGol <= 0) return;
  const rosa = ROSE[sqId];
  if (!rosa) return;
  const attaccanti = (rosa.difensori_alta || []).concat(rosa.centrocampisti || []);
  const pool = attaccanti.length ? attaccanti : (rosa.difensori || []).concat(rosa.portiere || []);
  if (!pool.length) return;
  for (let g = 0; g < nGol; g++) {
    let nome;
    if (Math.random() < 0.75 && attaccanti.length) {
      nome = attaccanti[Math.floor(Math.random() * attaccanti.length)];
    } else {
      const dif = (rosa.difensori || []).slice();
      nome = dif.length ? dif[Math.floor(Math.random() * dif.length)]
                        : pool[Math.floor(Math.random() * pool.length)];
    }
    const key = nome + '|' + sqId;
    if (!stato.marcatori[key]) {
      stato.marcatori[key] = { nome: nome, squadra: sqId, gol: 0 };
    }
    stato.marcatori[key].gol++;
  }
}

function getClassificaMarcatori() {
  if (!stato.marcatori) return [];
  return Object.values(stato.marcatori)
    .filter(m => m.gol > 0)
    .sort((a, b) => b.gol - a.gol || a.nome.localeCompare(b.nome));
}

function simulaPartitaCompleta(g, i) {
  const giornata = CALENDARIO_SERIEA[g - 1];
  const p = giornata[i];
  const c = normalizzaNome(p.homeTeam);
  const t = normalizzaNome(p.awayTeam);
  const key = 'g' + g + '_' + i;
  if (stato.risultati[key]) return;
  const res = simula(c, t);
  stato.risultati[key] = res;
  aggiungiMarcatoriPartita(c, t, res[0], res[1]);
  simulaAmmonizioniPartita(c, t);
}

/* RENDER */
function render() {
  const content = document.getElementById('content');
  if (!stato || stato.fase === 'scelta') return renderScelta(content);
  return renderCampionato(content);
}

function renderScelta(content) {
  let html = '<div class="fase-titolo">Scegli la tua squadra</div>' +
    '<div class="avviso">Seleziona una squadra di Serie A 2026/2027 per iniziare il campionato.</div>' +
    '<div class="squadre-grid">';
  SQUADRE_ORDINE.forEach(id => {
    const sq = SQUADRE[id]; if (!sq) return;
    html += '<div class="squadra-btn ' + (stato && id === stato.squadraScelta ? 'selezionata' : '') + '" onclick="selezionaSquadra(\'' + id + '\')">' +
      '<div class="maglia">' + creaGiocatoreSVG(sq.casa, 'fermo') + '</div>' +
      '<div>' + sq.nome + '</div></div>';
  });
  html += '</div>';
  if (stato && stato.squadraScelta) {
    html += '<div style="text-align:center;margin-top:16px">' +
      '<button class="btn primario" onclick="iniziaCampionato()">INIZIA CAMPIONATO</button></div>';
  }
  content.innerHTML = html;
}

function selezionaSquadra(id) {
  if (!stato) stato = nuovoStato();
  stato.squadraScelta = id;
  render();
}
function iniziaCampionato() {
  stato.fase = 'campionato';
  stato.giornataCorrente = 1;
  stato.risultati = {};
  stato.marcatori = {};
  tabAttivo = 'classifica';
  salvaStato();
  render();
}

function renderCampionato(content) {
  const tua = stato.squadraScelta;
  const nomeTua = SQUADRE[tua] ? SQUADRE[tua].nome : tua;

  let prossima = null;
  for (let g = 1; g <= 38; g++) {
    const giornata = CALENDARIO_SERIEA[g - 1];
    for (let i = 0; i < giornata.length; i++) {
      const key = 'g' + g + '_' + i;
      if (stato.risultati[key]) continue;
      const p = giornata[i];
      const casa = normalizzaNome(p.homeTeam);
      const trasf = normalizzaNome(p.awayTeam);
      if (casa === tua || trasf === tua) {
        prossima = { g, i, casa, trasferta: trasf, partita: p };
        break;
      }
    }
    if (prossima) break;
  }

  let html = '<div class="avviso">Squadra: <strong>' + nomeTua +
    '</strong> · Giornata: <strong>' + stato.giornataCorrente + '</strong>/38</div>';

  if (prossima) {
    const nomeCasa = SQUADRE[prossima.casa] ? SQUADRE[prossima.casa].nome : prossima.casa;
    const nomeTrasf = SQUADRE[prossima.trasferta] ? SQUADRE[prossima.trasferta].nome : prossima.trasferta;
    const tuSeiCasa = prossima.casa === tua;
    html += '<div class="prossima-partita">' +
      '<h3>⚽ PROSSIMA PARTITA — Giornata ' + prossima.g + '</h3>' +
      '<div class="vs">' + nomeCasa + ' vs ' + nomeTrasf + '</div>' +
      '<div class="info">' + (tuSeiCasa ? '🏠 IN CASA' : '✈️ IN TRASFERTA') +
      ' · ' + (prossima.partita.localDate || '') + ' · ' + (prossima.partita.localTime || '') + '</div>' +
      '<button class="play-big" onclick="giocaPartita(' + prossima.g + ', ' + prossima.i + ')">▶ GIOCA</button></div>';
  } else {
    html += '<div class="prossima-partita" style="background:#16213e;color:#ffd700">' +
      '<h3>🏆 Campionato terminato</h3>' +
      '<button class="play-big" onclick="resetCampionato()">NUOVO CAMPIONATO</button></div>';
  }

  const tabSis = tabAttivo || 'classifica';
  html += '<div class="tabs">' +
    '<button class="tab-btn ' + (tabSis === 'classifica' ? 'attivo' : '') +
    '" onclick="cambiaTab(\'classifica\')">📊 Classifica</button>' +
    '<button class="tab-btn ' + (tabSis === 'giornate' ? 'attivo' : '') +
    '" onclick="cambiaTab(\'giornate\')">📅 Giornate</button>' +
    '<button class="tab-btn ' + (tabSis === 'marcatori' ? 'attivo' : '') +
    '" onclick="cambiaTab(\'marcatori\')">⚽ Marcatori</button>' +
    '</div>';

  html += '<div class="tab-content ' + (tabSis === 'classifica' ? 'attivo' : '') + '">';
  html += renderTabClassifica(tua);
  html += '</div>';

  html += '<div class="tab-content ' + (tabSis === 'giornate' ? 'attivo' : '') + '">';
  html += renderTabGiornate(tua);
  html += '</div>';

  html += '<div class="tab-content ' + (tabSis === 'marcatori' ? 'attivo' : '') + '">';
  html += renderTabMarcatori(tua);
  html += '</div>';

  content.innerHTML = html;
}

function cambiaTab(t) {
  tabAttivo = t;
  render();
}

function renderTabClassifica(tua) {
  const cls = getClassifica();
  let html = '<div class="classifica-box"><h3>📊 Classifica Serie A</h3>' +
    '<table class="classifica">' +
    '<tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th><th>DR</th></tr>';
  cls.forEach((t, idx) => {
    const sqInfo = SQUADRE[t.squadra];
    const nomeSq = sqInfo ? sqInfo.nome : t.squadra;
    const isTua = t.squadra === tua ? 'tua' : '';
    let pos = '';
    if (idx < 4) pos = 'champions';
    else if (idx < 6) pos = 'europa';
    else if (idx >= 17) pos = 'relegazione';
    html += '<tr class="' + isTua + ' ' + pos + '">' +
      '<td>' + (idx + 1) + '</td><td>' + nomeSq + '</td>' +
      '<td>' + t.punti + '</td><td>' + t.giocate + '</td><td>' + t.vinte + '</td>' +
      '<td>' + t.pareggi + '</td><td>' + t.perse + '</td>' +
      '<td>' + t.gf + '</td><td>' + t.gs + '</td><td>' + (t.dr > 0 ? '+' : '') + t.dr + '</td></tr>';
  });
  html += '</table></div>';
  return html;
}

function renderTabGiornate(tua) {
  let html = '<div class="fase-titolo">📅 Giornata ' + stato.giornataCorrente + '</div>';
  const giornata = CALENDARIO_SERIEA[stato.giornataCorrente - 1] || [];
  html += '<div class="giornata-box">';
  giornata.forEach((p, i) => {
    const key = 'g' + stato.giornataCorrente + '_' + i;
    const r = stato.risultati[key];
    const score = r ? (r[0] + '-' + r[1]) : 'Da giocare';
    const casa = normalizzaNome(p.homeTeam);
    const trasf = normalizzaNome(p.awayTeam);
    const nomeCasa = SQUADRE[casa] ? SQUADRE[casa].nome : p.homeTeam;
    const nomeTrasf = SQUADRE[trasf] ? SQUADRE[trasf].nome : p.awayTeam;
    const isTua = (casa === tua || trasf === tua) ? 'tua' : '';
    html += '<div class="match-row ' + isTua + '">' +
      '<span class="sq casa">' + nomeCasa + '</span>' +
      '<span class="score">' + score + '</span>' +
      '<span class="sq trasf">' + nomeTrasf + '</span></div>';
  });
  html += '</div>';

  html += '<div class="giornata-nav">' +
    '<button onclick="cambiaGiornata(-1)" ' + (stato.giornataCorrente <= 1 ? 'disabled' : '') + '>◀ Prec</button>' +
    '<span class="label">Giornata ' + stato.giornataCorrente + ' / 38</span>' +
    '<button onclick="cambiaGiornata(1)" ' + (stato.giornataCorrente >= 38 ? 'disabled' : '') + '>Succ ▶</button></div>';
  return html;
}

function renderTabMarcatori(tua) {
  const lista = getClassificaMarcatori();
  if (!lista.length) {
    return '<div class="marcatori-box"><h3>⚽ Classifica Marcatori</h3>' +
      '<div style="text-align:center;color:#aaa;padding:20px">' +
      'Nessun gol registrato. Gioca qualche partita per vedere i marcatori.</div></div>';
  }
  let html = '<div class="marcatori-box"><h3>⚽ Classifica Marcatori</h3>' +
    '<table class="marcatori">' +
    '<tr><th>#</th><th>Giocatore</th><th>Squadra</th><th>Gol</th></tr>';
  lista.forEach((m, idx) => {
    const sqInfo = SQUADRE[m.squadra];
    const nomeSq = sqInfo ? sqInfo.nome : m.squadra;
    const isTua = m.squadra === tua ? 'tua' : '';
    const podio = idx < 3 ? 'podio' : '';
    let medaglia = (idx + 1);
    if (idx === 0) medaglia = '🥇';
    else if (idx === 1) medaglia = '🥈';
    else if (idx === 2) medaglia = '🥉';
    html += '<tr class="' + isTua + ' ' + podio + '">' +
      '<td>' + medaglia + '</td><td>' + m.nome + '</td>' +
      '<td>' + nomeSq + '</td><td>' + m.gol + '</td></tr>';
  });
  html += '</table></div>';
  return html;
}

function cambiaGiornata(delta) {
  stato.giornataCorrente = Math.max(1, Math.min(38, stato.giornataCorrente + delta));
  salvaStato();
  render();
}

/* GIOCO */
function giocaPartita(g, i) {
  const partita = CALENDARIO_SERIEA[g - 1][i];
  const casa = normalizzaNome(partita.homeTeam);
  const trasf = normalizzaNome(partita.awayTeam);
  const tua = stato.squadraScelta;
  const sqTU = casa === tua ? casa : trasf;
  const sqCPU = casa === tua ? trasf : casa;
  const idPartita = 'g' + g + '_' + i;
  const params = new URLSearchParams({
    torneo:'seriea',
    partita: idPartita,
    sqTU: sqTU,
    sqCPU: sqCPU,
    casa: casa,
    trasferta: trasf
  });
  location.href = 'index.html?' + params.toString();
}

function simulaRestoGiornata(g) {
  const giornata = CALENDARIO_SERIEA[g - 1];
  for (let i = 0; i < giornata.length; i++) {
    const key = 'g' + g + '_' + i;
    if (stato.risultati[key]) continue;
    const p = giornata[i];
    const c = normalizzaNome(p.homeTeam);
    const t = normalizzaNome(p.awayTeam);
    if (c === stato.squadraScelta || t === stato.squadraScelta) continue;
    simulaPartitaCompleta(g, i);
  }
  salvaAmmonizioni();
  salvaStato();
}

/* RICEZIONE RISULTATO */
function riceviRisultato() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('risultato');
  if (!id) return false;
  if (!stato) return false;
  const json = localStorage.getItem('campionato_partita_' + id);
  if (!json) return false;
  const risultato = JSON.parse(json);
  localStorage.removeItem('campionato_partita_' + id);

  const casa = risultato.casaOriginale;
  const trasferta = risultato.trasfertaOriginale;
  const sqTU = risultato.sqTU;
  if (!casa || !trasferta || !sqTU) return false;

  const golTU = risultato.golTU;
  const golCPU = risultato.golCPU;
  const golCasa = casa === sqTU ? golTU : golCPU;
  const golTrasferta = casa === sqTU ? golCPU : golTU;

  stato.risultati[id] = [golCasa, golTrasferta];

  aggiungiMarcatoriPartita(casa, trasferta, golCasa, golTrasferta);

  resetSqualificheDopoPartita(sqTU);
  salvaAmmonizioni();

  const parti = id.split('_');
  const g = parseInt(parti[0].substring(1));
  simulaRestoGiornata(g);

  const giornata = CALENDARIO_SERIEA[g - 1];
  for (let i=0;i<giornata.length;i++) {
    const p = giornata[i];
    const c = normalizzaNome(p.homeTeam);
    const t = normalizzaNome(p.awayTeam);
    if (c !== sqTU) resetSqualificheDopoPartita(c);
    if (t !== sqTU) resetSqualificheDopoPartita(t);
  }
  salvaAmmonizioni();

  window.history.replaceState({}, document.title, 'seriea2027.html');
  salvaStato();
  return true;
}

/* AVVIO */
try {
  inizializzaAmmonizioniCampionato();
  const salvato = caricaStato();
  stato = salvato || nuovoStato();
  if (!stato.marcatori) stato.marcatori = {};
  if (!stato.risultati) stato.risultati = {};
  riceviRisultato();
  render();
} catch(err) {
  document.getElementById('content').innerHTML =
    '<div style="background:#8B2020;color:#fff;padding:30px;font-family:monospace;font-size:14px;white-space:pre-wrap">' +
    '<h2>ERRORE</h2><p>' + err.message + '</p><pre>' + (err.stack||'') + '</pre></div>';
}
