<!DOCTYPE html>
<html lang="it">
<head>

<title>Serie A 2026/2027</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a15;
    color: #eee;
    overflow: hidden;
    user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .header {
    background: linear-gradient(135deg, #16213e, #0f3460);
    padding: 16px;
    text-align: center;
    border-bottom: 3px solid #ffd700;
    position: sticky;

  .header h1 { font-size: 22px; color: #ffd700; letter-spacing: 2px; }

  .content { padding: 16px; max-width: 1100px; margin: 0 auto; width: 100%; padding-bottom: 40px; }
  .fase-titolo {

  .classifica-box {

  .cannonieri td:first-child { text-align: left; font-weight: bold; width: 30px; color: #ffd700; }
  .cannonieri td:nth-child(2) { text-align: left; }
  .cannonieri td:nth-child(3) { text-align: left; color: #aaa; font-size: 11px; }
  .cannonieri td:last-child { font-weight: bold; color: #4ade80; }

  /* TABS */
  .tabs-classifica {
    display: flex; gap: 6px; justify-content: center;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .tab-btn {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;
    border-radius: 8px 8px 0 0; padding: 10px 16px;
    font-weight: bold; font-size: 12px; cursor: pointer;

  }
  .tab-btn:hover { background: #1a4a7a; }
  .tab-btn.attivo { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .tab-pannello { display: none; }
  .tab-pannello.attivo { display: block; }

  .giornata-box {
    background: #16213e; border: 2px solid #ffd700; border-radius: 10px;
    padding: 12px; margin: 12px 0;
  }
  .giornata-box h3 { color: #ffd700; font-size: 14px; margin-bottom: 8px; }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .match-row.tua { background: rgba(77,171,247,0.2); border-radius: 4px; }
  .match-row .score { color: #ffd700; font-weight: bold; margin: 0 8px; }
  .match-row .sq { flex: 1; }
  .match-row .sq.casa { text-align: right; }
  .match-row .sq.trasf { text-align: left; }
  .squadre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .squadra-btn {
    background: #0f3460; border: 2px solid #4dabf7; border-radius: 8px;
    padding: 8px; cursor: pointer; text-align: center; color: #fff;
    font-size: 11px; font-weight: bold; transition: all 0.2s;
  }
  .squadra-btn:hover { background: #4dabf7; color: #16213e; }
  .squadra-btn.selezionata { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .squadra-btn .maglia { width: 40px; height: 52px; margin: 0 auto 4px; }
  .squadra-btn .maglia svg { width: 100%; height: 100%; }
  .btn {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;
    padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold;
    cursor: pointer; margin: 4px;
  }
  .btn:hover { background: #4dabf7; color: #16213e; }
  .btn.primario { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .btn.primario:hover { background: #fff; }
  .btn.pericolo { background: #8B2020; border-color: #ff6b6b; }
  .btn.pericolo:hover { background: #ff6b6b; color: #fff; }
  .torna-menu {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: #0f3460; border: 2px solid #4dabf7; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;

  .torna-menu:hover { background: #4dabf7; color: #16213e; }
  .top-buttons-right {
    position: fixed; top: 10px; right: 10px; z-index: 20;

  .top-buttons-right button {

  .top-buttons-right button:hover { background: #4dabf7; color: #16213e; }
  .top-buttons-right button.pericolo { background: #8B2020; border-color: #ff6b6b; }
  .top-buttons-right button.pericolo:hover { background: #ff6b6b; }
  .avviso {

  .prossima-partita {

  .prossima-partita h3 { font-size: 14px; margin-bottom: 8px; }
  .prossima-partita .vs { font-size: 20px; font-weight: 900; margin: 8px 0; letter-spacing: 2px; }
  .prossima-partita .info { font-size: 11px; margin-bottom: 8px; }
  .prossima-partita .play-big {

  .prossima-partita .play-big:hover { background: #000; }
  .giornata-nav {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin: 10px 0;
  }
  .giornata-nav button {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;

  .giornata-nav button:hover:not(:disabled) { background: #4dabf7; color: #16213e; }
  .giornata-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
  .giornata-nav .label { color: #ffd700; font-weight: bold; font-size: 13px; }

  .modale {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);

  }
  .modale.nascosto { display: none; }
  .modale-box {
    background: #16213e; border: 3px solid #ffd700; border-radius: 14px;

  .modale-box h2 { color: #ffd700; margin-bottom: 14px; font-size: 20px; }
  .modale-box button {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;
    padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: bold;
    cursor: pointer; margin: 4px; width: 100%;
  }
  .modale-box button.primario { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .modale-box button.pericolo { background: #8B2020; border-color: #ff6b6b; }
  .modale-box button:hover { background: #4dabf7; color: #16213e; }
  .modale-box button.primario:hover { background: #fff; }
  .modale-box .info {
    font-size: 12px; color: #aaa; margin-bottom: 16px; line-height: 1.5;
  }
  .ammonizioni-lista {
    background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px;
    max-height: 40vh; overflow-y: auto; text-align: left;

  }
  .ammonizioni-lista .squadra-titolo {

  .ammonizioni-lista .giocatore {
    display: flex; justify-content: space-between; padding: 2px 4px;
  }
  .ammonizioni-lista .giocatore.ammonito { color: #ffd700; }

</style>

<body>
<button class="torna-menu" onclick="location.href='index.html'">← Menù</button>
<div class="top-buttons-right">
  <button onclick="apriGestioneAmmonizioni()">📋 Ammonizioni</button>
  <button class="pericolo" onclick="resetCampionato()">🗑 Reset</button>
</div>
<div class="app">
  <div class="header">
    <h1>⚽ SERIE A 2026/2027</h1>
    <p>20 squadre · 38 giornate · 380 partite</p>
  </div>
  <div class="content" id="content">
    <div style="text-align:center;padding:40px;color:#ffd700">Caricamento...</div>
  </div>
</div>

<div class="modale nascosto" id="modale-ammonizioni">
  <div class="modale-box">
    <h2>📋 Gestione Ammonizioni</h2>
    <div class="info">
      Le ammonizioni si accumulano tra partite. Un giocatore con 2 gialli salta la prossima partita.
      Puoi esportare le ammonizioni in un file JSON e importarle su un altro dispositivo.
    </div>
    <div id="ammonizioni-contenuto"></div>
    <button class="primario" onclick="esportaAmmonizioniDaSerieA()">💾 Salva ammonizioni su file</button>
    <button onclick="document.getElementById('file-input-amm-seriea').click()">📂 Carica ammonizioni da file</button>
    <button class="pericolo" onclick="resetAmmonizioniDaSerieA()">🗑 Azzera tutte le ammonizioni</button>
    <button onclick="chiudiModaleAmmonizioni()">← Chiudi</button>
    <input type="file" id="file-input-amm-seriea" accept=".json,application/json" style="display:none" onchange="gestisciFileAmmSerieA(event)">
  </div>
</div>

<script src="divise.js"></script>
<script src="ammonizioni.js"></script>
<script>
/* ============================================================
   MAPPA NOMI
   ============================================================ */
const MAPPA_NOMI = {
  'ac milan': 'milan',
  'as roma': 'roma'
};

function normalizzaNome(nome) {
  if (!nome) return '';
  const n = nome.toLowerCase().trim();
  return MAPPA_NOMI[n] || n;
}

/* ============================================================
   CALENDARIO SERIE A 2026/2027 (invariato — copia il tuo array
   CALENDARIO_SERIEA qui, identico all'originale)
   ============================================================ */
/* >>> INCOLLA QUI IL TUO ARRAY CALENDARIO_SERIEA ORIGINALE <<< */
const CALENDARIO_SERIEA = window.CALENDARIO_SERIEA_PLACEHOLDER || [];

/* ============================================================
   STATO CAMPIONATO
   ============================================================ */
const STORAGE_KEY = 'seriea2027_v1';
const SQUADRE_ORDINE = ['atalanta','bologna','cagliari','como','fiorentina','frosinone','genoa','inter','juventus','lazio','lecce','milan','monza','napoli','parma','roma','sassuolo','torino','udinese','venezia'];

let stato = null;
let ammonizioniCampionato = null;
let tabAttivo = 'classifica'; // classifica | giornate | cannonieri

function nuovoStato() {
  return { squadraScelta: null, fase: 'scelta', giornataCorrente: 1, risultati: {} };
}
function salvaStato() { if (!stato) return; try { localStorage.setItem(STORAGE_KEY, JSON.stringify(stato)); } catch(e){} }
function caricaStato() { const s = localStorage.getItem(STORAGE_KEY); if (!s) return null; try { return JSON.parse(s); } catch(e){ return null; } }
function resetCampionato() {
  if (confirm('Reset campionato? Perderai tutti i progressi (ma NON le ammonizioni).')) {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem('campionato_partita_attiva');
    location.reload();
  }
}

/* AMMONIZIONI (invariato) */
function caricaAmmonizioni() { try { var s = localStorage.getItem('campionato_ammonizioni'); if (s) return JSON.parse(s); } catch(e){} return null; }
function salvaAmmonizioni() { try { localStorage.setItem('campionato_ammonizioni', JSON.stringify(ammonizioniCampionato)); } catch(e){} }
function inizializzaAmmonizioniCampionato() { var d = caricaAmmonizioni(); ammonizioniCampionato = (d && d.squadre) ? d : inizializzaAmmonizioniVuote(); }
function getGiocatoreAmm(sqId, nome) {
  if (!ammonizioniCampionato || !ammonizioniCampionato.squadre[sqId]) return null;
  var sq = ammonizioniCampionato.squadre[sqId];
  var ruoli = ['portiere','difensori','centrocampisti','difensori_alta','panchina'];
  for (var i=0;i<ruoli.length;i++) { var r = ruoli[i]; if (sq[r] && sq[r][nome]) return sq[r][nome]; }
  return null;
}
function aggiornaAmmonizione(sqId, nome, d) { var g = getGiocatoreAmm(sqId, nome); if (!g) return; g.gialli += d; if (g.gialli >= 2) g.squalificato = true; }
function resetSqualificheDopoPartita(sqId) {
  if (!ammonizioniCampionato.squadre[sqId]) return;
  var sq = ammonizioniCampionato.squadre[sqId];
  var ruoli = ['portiere','difensori','centrocampisti','difensori_alta','panchina'];
  for (var i=0;i<ruoli.length;i++) { var r = ruoli[i]; if (!sq[r]) continue; var nomi = Object.keys(sq[r]); for (var n=0;n<nomi.length;n++) { var g = sq[r][nomi[n]]; if (g.squalificato) { g.gialli = 0; g.squalificato = false; } } }
}
function esportaAmmonizioniDaSerieA() {
  var data = new Date().toISOString().slice(0,10);
  var nomeFile = 'ammonizioni_' + data + '.json';
  var blob = new Blob([JSON.stringify(ammonizioniCampionato, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = nomeFile;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importaAmmonizioniDaFile(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var dati = JSON.parse(e.target.result);
      if (!dati.squadre) { alert('File non valido: manca il campo "squadre"'); return; }
      ammonizioniCampionato = dati; salvaAmmonizioni();
      alert('✅ Ammonizioni importate con successo!'); renderAmmonizioniLista();
    } catch(err) { alert('Errore nel parsing del file: ' + err.message); }
  };
  reader.readAsText(file);
}
function resetAmmonizioniDaSerieA() {
  if (!confirm('Sei sicuro di voler azzerare TUTTE le ammonizioni? Questa azione è irreversibile.')) return;
  ammonizioniCampionato = inizializzaAmmonizioniVuote(); salvaAmmonizioni();
  alert('✅ Ammonizioni azzerate'); renderAmmonizioniLista();
}
function apriGestioneAmmonizioni() { document.getElementById('modale-ammonizioni').classList.remove('nascosto'); renderAmmonizioniLista(); }
function chiudiModaleAmmonizioni() { document.getElementById('modale-ammonizioni').classList.add('nascosto'); }
function gestisciFileAmmSerieA(ev) { var f = ev.target.files[0]; if (!f) return; importaAmmonizioniDaFile(f); ev.target.value = ''; }
function renderAmmonizioniLista() {
  var cont = document.getElementById('ammonizioni-contenuto'); if (!cont) return;
  var html = '<div class="ammonizioni-lista">';
  var keys = Object.keys(ammonizioniCampionato.squadre);
  for (var i=0;i<keys.length;i++) {
    var sqId = keys[i]; var sqNome = SQUADRE[sqId] ? SQUADRE[sqId].nome : sqId;
    var sq = ammonizioniCampionato.squadre[sqId]; var haAm = false, righe = '';
    var ruoli = ['portiere','difensori','centrocampisti','difensori_alta','panchina'];
    for (var r=0;r<ruoli.length;r++) {
      var ruolo = ruoli[r]; if (!sq[ruolo]) continue;
      var nomi = Object.keys(sq[ruolo]);
      for (var n=0;n<nomi.length;n++) {
        var g = sq[ruolo][nomi[n]];
        if (g.gialli > 0 || g.squalificato) {
          haAm = true;
          var cls = g.squalificato ? 'squalificato' : 'ammonito';
          righe += '<div class="giocatore ' + cls + '"><span>' + nomi[n] + '</span><span>' + (g.squalificato ? '🚫 SQUALIFICATO' : '🟨 ' + g.gialli) + '</span></div>';
        }
      }
    }
    if (haAm) html += '<div class="squadra-titolo">' + sqNome + '</div>' + righe;
  }
  if (html === '<div class="ammonizioni-lista">') html += '<div style="text-align:center;color:#aaa;padding:20px">Nessuna ammonizione registrata</div>';
  html += '</div>';
  cont.innerHTML = html;
}

/* SIMULAZIONE AMMONIZIONI (invariato) */
function simulaAmmonizioniPartita(sqCasaId, sqTrasfId) {
  var sqIds = [sqCasaId, sqTrasfId];
  for (var s=0;s<sqIds.length;s++) {
    var sqId = sqIds[s]; var rosa = ROSE[sqId]; if (!rosa) continue;
    var giocatori = [];
    if (rosa.portiere[0]) giocatori.push(rosa.portiere[0]);
    for (var d=0;d<rosa.difensori.length;d++) giocatori.push(rosa.difensori[d]);
    for (var c=0;c<rosa.centrocampisti.length;c++) giocatori.push(rosa.centrocampisti[c]);
    for (var da=0;da<rosa.difensori_alta.length;da++) giocatori.push(rosa.difensori_alta[da]);
    if (Math.random() < 0.30) {
      var nG = Math.random() < 0.75 ? 1 : 2;
      for (var g=0;g<nG;g++) aggiornaAmmonizione(sqId, giocatori[Math.floor(Math.random()*giocatori.length)], 1);
    }
  }
}

/* ============================================================
   CLASSIFICA (invariato)
   ============================================================ */
function getClassifica() {
  const tab = {};
  SQUADRE_ORDINE.forEach(sq => tab[sq] = { squadra:sq, punti:0, giocate:0, vinte:0, pareggi:0, perse:0, gf:0, gs:0, dr:0 });
  for (const key in stato.risultati) {
    const r = stato.risultati[key]; if (!r) continue;
    const parti = key.split('_');
    const g = parseInt(parti[0].substring(1));
    const idx = parseInt(parti[1]);
    const giornata = CALENDARIO_SERIEA[g - 1]; if (!giornata) continue;
    const partita = giornata[idx]; if (!partita) continue;
    const casa = normalizzaNome(partita.homeTeam);
    const trasf = normalizzaNome(partita.awayTeam);
    const c = tab[casa], t = tab[trasf]; if (!c || !t) continue;
    const gc = r[0], gt = r[1];
    c.giocate++; t.giocate++; c.gf += gc; c.gs += gt; t.gf += gt; t.gs += gc;
    if (gc > gt) { c.punti += 3; c.vinte++; t.perse++; }
    else if (gc < gt) { t.punti += 3; t.vinte++; c.perse++; }
    else { c.punti++; t.punti++; c.pareggi++; t.pareggi++; }
    c.dr = c.gf - c.gs; t.dr = t.gf - t.gs;
  }
  return Object.values(tab).sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

/* ============================================================
   CANNONIERI — 2 marcatori per squadra calcolati dai risultati
   Deterministico: per ogni gol viene scelto uno dei 2 attaccanti
   in base all'hash della partita + indice del gol.
   ============================================================ */
function hashString(s) {
  var h = 0;
  for (var i=0;i<s.length;i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h);
}

function getAttaccantiSquadra(sqId) {
  // I 2 "attaccanti" sono i difensori_alta della rosa (ruolo ATT nel motore).
  // Se mancano, fallback sui primi 2 centrocampisti.
  var rosa = ROSE[sqId];
  if (!rosa) return [];
  var att = rosa.difensori_alta || [];
  if (att.length >= 2) return [att[0], att[1]];
  var cen = rosa.centrocampisti || [];
  if (cen.length >= 2) return [cen[0], cen[1]];
  return att.concat(cen).slice(0, 2);
}

function getCannonieri() {
  // struttura: { nomeGiocatore: { nome, squadraId, gol } }
  var marcatori = {};

  function aggiungiGol(sqId, nome) {
    var key = sqId + '|' + nome;
    if (!marcatori[key]) marcatori[key] = { nome: nome, squadraId: sqId, gol: 0 };
    marcatori[key].gol++;
  }

  for (const key in stato.risultati) {
    const r = stato.risultati[key]; if (!r) continue;
    const parti = key.split('_');
    const g = parseInt(parti[0].substring(1));
    const idx = parseInt(parti[1]);
    const giornata = CALENDARIO_SERIEA[g - 1]; if (!giornata) continue;
    const partita = giornata[idx]; if (!partita) continue;
    const casaId = normalizzaNome(partita.homeTeam);
    const trasfId = normalizzaNome(partita.awayTeam);
    const attCasa = getAttaccantiSquadra(casaId);
    const attTrasf = getAttaccantiSquadra(trasfId);
    if (attCasa.length === 0 && attTrasf.length === 0) continue;

    var golCasa = r[0], golTrasf = r[1];
    var seed = hashString(key + '|' + casaId + '|' + trasfId);

    for (var i=0;i<golCasa;i++) {
      if (attCasa.length === 0) break;
      var scelta = (seed + i * 7919) % attCasa.length;
      aggiungiGol(casaId, attCasa[scelta]);
    }
    for (var j=0;j<golTrasf;j++) {
      if (attTrasf.length === 0) break;
      var scelta2 = (seed + j * 104729) % attTrasf.length;
      aggiungiGol(trasfId, attTrasf[scelta2]);
    }
  }

  // Filtra: solo i primi 2 marcatori per squadra, poi ordina globalmente
  var perSquadra = {};
  Object.keys(marcatori).forEach(function(k) {
    var m = marcatori[k];
    if (!perSquadra[m.squadraId]) perSquadra[m.squadraId] = [];
    perSquadra[m.squadraId].push(m);
  });
  var risultato = [];
  Object.keys(perSquadra).forEach(function(sqId) {
    perSquadra[sqId].sort(function(a,b){ return b.gol - a.gol; });
    risultato = risultato.concat(perSquadra[sqId].slice(0, 2));
  });
  risultato.sort(function(a,b){
    if (b.gol !== a.gol) return b.gol - a.gol;
    return a.nome.localeCompare(b.nome);
  });
  return risultato;
}

/* ============================================================
   SIMULAZIONE
   ============================================================ */
const FORZA = {
  inter:90, milan:88, juventus:87, napoli:86, roma:84, lazio:82, atalanta:85,
  fiorentina:80, bologna:78, torino:74, udinese:72, genoa:70, cagliari:68,
  como:66, parma:64, monza:63, frosinone:60, venezia:58, lecce:62, sassuolo:61
};
function forza(id) { return FORZA[id] || 65; }
function simula(a, b) {
  const fa = forza(a), fb = forza(b);
  const pa = fa / (fa + fb);
  const ga = Math.random() < pa ? Math.floor(Math.random()*4) : Math.floor(Math.random()*2);
  const gb = Math.random() < (1-pa) ? Math.floor(Math.random()*4) : Math.floor(Math.random()*2);
  return [ga, gb];
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  const content = document.getElementById('content');
  if (!stato || stato.fase === 'scelta') return renderScelta(content);
  return renderCampionato(content);
}

function renderScelta(content) {
  let html = '<div class="fase-titolo">Scegli la tua squadra</div>' +
    '<div class="avviso">Seleziona una squadra di Serie A 2026/2027 per iniziare il campionato.</div>' +
    '<div class="squadre-grid">';
  SQUADRE_ORDINE.forEach(id => {
    const sq = SQUADRE[id]; if (!sq) return;
    html += '<div class="squadra-btn ' + (stato && id === stato.squadraScelta ? 'selezionata' : '') + '" onclick="selezionaSquadra(\'' + id + '\')">' +
      '<div class="maglia">' + creaGiocatoreSVG(sq.casa, 'fermo') + '</div>' +
      '<div>' + sq.nome + '</div></div>';
  });
  html += '</div>';
  if (stato && stato.squadraScelta) {
    html += '<div style="text-align:center;margin-top:16px"><button class="btn primario" onclick="iniziaCampionato()">INIZIA CAMPIONATO</button></div>';
  }
  content.innerHTML = html;
}

function selezionaSquadra(id) { if (!stato) stato = nuovoStato(); stato.squadraScelta = id; render(); }
function iniziaCampionato() { stato.fase = 'campionato'; stato.giornataCorrente = 1; stato.risultati = {}; salvaStato(); render(); }

/* TAB */
function cambiaTab(nome) {
  tabAttivo = nome;
  document.querySelectorAll('.tab-btn').forEach(function(b) {
    b.classList.toggle('attivo', b.dataset.tab === nome);
  });
  document.querySelectorAll('.tab-pannello').forEach(function(p) {
    p.classList.toggle('attivo', p.id === 'tab-' + nome);
  });
}

function renderCampionato(content) {
  const tua = stato.squadraScelta;
  const nomeTua = SQUADRE[tua] ? SQUADRE[tua].nome : tua;

  let prossima = null;
  for (let g=1; g<=38; g++) {
    const giornata = CALENDARIO_SERIEA[g-1];
    for (let i=0;i<giornata.length;i++) {
      const key = 'g' + g + '_' + i;
      if (stato.risultati[key]) continue;
      const p = giornata[i];
      const casa = normalizzaNome(p.homeTeam);
      const trasf = normalizzaNome(p.awayTeam);
      if (casa === tua || trasf === tua) { prossima = { g:g, i:i, casa:casa, trasferta:trasf, partita:p }; break; }
    }
    if (prossima) break;
  }

  let html = '<div class="avviso">Squadra: <strong>' + nomeTua + '</strong> · Giornata: <strong>' + stato.giornataCorrente + '</strong>/38</div>';

  if (prossima) {
    const nomeCasa = SQUADRE[prossima.casa] ? SQUADRE[prossima.casa].nome : prossima.casa;
    const nomeTrasf = SQUADRE[prossima.trasferta] ? SQUADRE[prossima.trasferta].nome : prossima.trasferta;
    const tuSeiCasa = prossima.casa === tua;
    html += '<div class="prossima-partita">' +
      '<h3>⚽ PROSSIMA PARTITA — Giornata ' + prossima.g + '</h3>' +
      '<div class="vs">' + nomeCasa + ' vs ' + nomeTrasf + '</div>' +
      '<div class="info">' + (tuSeiCasa ? '🏠 IN CASA' : '✈️ IN TRASFERTA') + ' · ' + (prossima.partita.localDate||'') + ' · ' + (prossima.partita.localTime||'') + '</div>' +
      '<button class="play-big" onclick="giocaPartita(' + prossima.g + ', ' + prossima.i + ')">▶ GIOCA</button></div>';
  } else {
    html += '<div class="prossima-partita" style="background:#16213e;color:#ffd700">' +
      '<h3>🏆 Campionato terminato</h3>' +
      '<button class="play-big" onclick="resetCampionato()">NUOVO CAMPIONATO</button></div>';
  }

  /* ===== TABS ===== */
  html += '<div class="tabs-classifica">' +
    '<button class="tab-btn ' + (tabAttivo==='classifica'?'attivo':'') + '" data-tab="classifica" onclick="cambiaTab(\'classifica\')">📊 Classifica</button>' +
    '<button class="tab-btn ' + (tabAttivo==='giornate'?'attivo':'') + '" data-tab="giornate" onclick="cambiaTab(\'giornate\')">📅 Giornate</button>' +
    '<button class="tab-btn ' + (tabAttivo==='cannonieri'?'attivo':'') + '" data-tab="cannonieri" onclick="cambiaTab(\'cannonieri\')">⚽ Cannonieri</button>' +
  '</div>';

  /* --- Tab Classifica --- */
  const cls = getClassifica();
  html += '<div id="tab-classifica" class="tab-pannello ' + (tabAttivo==='classifica'?'attivo':'') + '">';
  html += '<div class="classifica-box"><h3>📊 Classifica Serie A</h3><table class="classifica">' +
    '<tr><th>#</th><th>Squadra</th><th>Pt</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th><th>DR</th></tr>';
  cls.forEach((t, idx) => {
    const sqInfo = SQUADRE[t.squadra];
    const nomeSq = sqInfo ? sqInfo.nome : t.squadra;
    const isTua = t.squadra === tua ? 'tua' : '';
    let pos = '';
    if (idx < 4) pos = 'champions';
    else if (idx < 6) pos = 'europa';
    else if (idx >= 17) pos = 'relegazione';
    html += '<tr class="' + isTua + ' ' + pos + '">' +
      '<td>' + (idx+1) + '</td><td>' + nomeSq + '</td>' +
      '<td>' + t.punti + '</td><td>' + t.giocate + '</td><td>' + t.vinte + '</td><td>' + t.pareggi + '</td><td>' + t.perse + '</td>' +
      '<td>' + t.gf + '</td><td>' + t.gs + '</td><td>' + (t.dr > 0 ? '+' : '') + t.dr + '</td></tr>';
  });
  html += '</table></div>';
  html += '</div>';

  /* --- Tab Giornate --- */
  html += '<div id="tab-giornate" class="tab-pannello ' + (tabAttivo==='giornate'?'attivo':'') + '">';
  html += '<div class="fase-titolo">📅 Giornata ' + stato.giornataCorrente + '</div>';
  const giornata = CALENDARIO_SERIEA[stato.giornataCorrente - 1] || [];
  html += '<div class="giornata-box">';
  giornata.forEach((p, i) => {
    const key = 'g' + stato.giornataCorrente + '_' + i;
    const r = stato.risultati[key];
    const score = r ? (r[0] + '-' + r[1]) : 'Da giocare';
    const casa = normalizzaNome(p.homeTeam);
    const trasf = normalizzaNome(p.awayTeam);
    const nomeCasa = SQUADRE[casa] ? SQUADRE[casa].nome : p.homeTeam;
    const nomeTrasf = SQUADRE[trasf] ? SQUADRE[trasf].nome : p.awayTeam;
    const isTua = (casa === tua || trasf === tua) ? 'tua' : '';
    html += '<div class="match-row ' + isTua + '">' +
      '<span class="sq casa">' + nomeCasa + '</span>' +
      '<span class="score">' + score + '</span>' +
      '<span class="sq trasf">' + nomeTrasf + '</span></div>';
  });
  html += '</div>';
  html += '<div class="giornata-nav">' +
    '<button onclick="cambiaGiornata(-1)" ' + (stato.giornataCorrente <= 1 ? 'disabled' : '') + '>◀ Prec</button>' +
    '<span class="label">Giornata ' + stato.giornataCorrente + ' / 38</span>' +
    '<button onclick="cambiaGiornata(1)" ' + (stato.giornataCorrente >= 38 ? 'disabled' : '') + '>Succ ▶</button></div>';
  html += '</div>';

  /* --- Tab Cannonieri --- */
  html += '<div id="tab-cannonieri" class="tab-pannello ' + (tabAttivo==='cannonieri'?'attivo':'') + '">';
  const cannonieri = getCannonieri();
  if (cannonieri.length === 0) {
    html += '<div class="cannonieri-box"><h3>⚽ Classifica Cannonieri</h3><div style="text-align:center;color:#aaa;padding:20px">Nessun gol registrato. Gioca qualche partita!</div></div>';
  } else {
    html += '<div class="cannonieri-box"><h3>⚽ Classifica Cannonieri (top 2 per squadra)</h3><table class="cannonieri">' +
      '<tr><th>#</th><th>Giocatore</th><th>Squadra</th><th>Gol</th></tr>';
    cannonieri.forEach((m, idx) => {
      const sqInfo = SQUADRE[m.squadraId];
      const nomeSq = sqInfo ? sqInfo.nome : m.squadraId;
      const isTua = m.squadraId === tua ? 'tua' : '';
      html += '<tr class="' + isTua + '">' +
        '<td>' + (idx+1) + '</td>' +
        '<td>' + m.nome + '</td>' +
        '<td>' + nomeSq + '</td>' +
        '<td>' + m.gol + '</td></tr>';
    });
    html += '</table></div>';
  }
  html += '</div>';

  content.innerHTML = html;
}

function cambiaGiornata(delta) {
  stato.giornataCorrente = Math.max(1, Math.min(38, stato.giornataCorrente + delta));
  salvaStato();
  render();
}

/* GIOCO */
function giocaPartita(g, i) {
  const partita = CALENDARIO_SERIEA[g - 1][i];
  const casa = normalizzaNome(partita.homeTeam);
  const trasf = normalizzaNome(partita.awayTeam);
  const tua = stato.squadraScelta;
  const sqTU = casa === tua ? casa : trasf;
  const sqCPU = casa === tua ? trasf : casa;
  const idPartita = 'g' + g + '_' + i;
  const params = new URLSearchParams({
    torneo:'seriea', partita: idPartita, sqTU: sqTU, sqCPU: sqCPU, casa: casa, trasferta: trasf
  });
  location.href = 'index.html?' + params.toString();
}

function simulaRestoGiornata(g) {
  const giornata = CALENDARIO_SERIEA[g - 1];
  for (let i=0;i<giornata.length;i++) {
    const key = 'g' + g + '_' + i;
    if (stato.risultati[key]) continue;
    const p = giornata[i];
    const c = normalizzaNome(p.homeTeam);
    const t = normalizzaNome(p.awayTeam);
    if (c === stato.squadraScelta || t === stato.squadraScelta) continue;
    stato.risultati[key] = simula(c, t);
    simulaAmmonizioniPartita(c, t);
  }
  salvaAmmonizioni();
}

function riceviRisultato() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('risultato');
  if (!id) return false;
  if (!stato) return false;
  const json = localStorage.getItem('campionato_partita_' + id);
  if (!json) return false;
  const risultato = JSON.parse(json);
  localStorage.removeItem('campionato_partita_' + id);

  const casa = risultato.casaOriginale;
  const trasferta = risultato.trasfertaOriginale;
  const sqTU = risultato.sqTU;
  if (!casa || !trasferta || !sqTU) return false;

  const golTU = risultato.golTU;
  const golCPU = risultato.golCPU;
  const golCasa = casa === sqTU ? golTU : golCPU;
  const golTrasferta = casa === sqTU ? golCPU : golTU;

  stato.risultati[id] = [golCasa, golTrasferta];

  resetSqualificheDopoPartita(sqTU);
  salvaAmmonizioni();

  const parti = id.split('_');
  const g = parseInt(parti[0].substring(1));
  simulaRestoGiornata(g);

  const giornata = CALENDARIO_SERIEA[g - 1];
  for (let i=0;i<giornata.length;i++) {
    const p = giornata[i];
    const c = normalizzaNome(p.homeTeam);
    const t = normalizzaNome(p.awayTeam);
    if (c !== sqTU) resetSqualificheDopoPartita(c);
    if (t !== sqTU) resetSqualificheDopoPartita(t);
  }
  salvaAmmonizioni();

  window.history.replaceState({}, document.title, 'seriea2027.html');
  salvaStato();
  return true;
}

/* AVVIO */
try {
  inizializzaAmmonizioniCampionato();
  const salvato = caricaStato();
  stato = salvato || nuovoStato();
  riceviRisultato();
  render();
} catch(err) {
  document.getElementById('content').innerHTML =
    '<div style="background:#8B2020;color:#fff;padding:30px;font-family:monospace;font-size:14px;white-space:pre-wrap">' +
    '<h2>ERRORE</h2><p>' + err.message + '</p><pre>' + (err.stack||'') + '</pre></div>';
}
</script>
