<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Editor Campo v4 — Calcio a Carte</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a15; color: #eee; overflow: hidden; user-select: none; }

  /* ===== STESSA STRUTTURA DEL GIOCO ===== */
  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; position: relative; }
  .stadio-sfondo { position: fixed; inset: 0; background: url('Stadio.jpg') center/cover no-repeat; z-index: 0; pointer-events: none; }
  .stadio-sfondo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,10,21,0.55) 0%, rgba(10,10,21,0.15) 30%, rgba(10,10,21,0.15) 70%, rgba(10,10,21,0.75) 100%); }

  .toolbar { display: flex; gap: 8px; align-items: center; padding: 6px 14px; background: rgba(22,33,62,0.95); backdrop-filter: blur(8px); border-bottom: 2px solid #0f3460; flex-shrink: 0; position: relative; z-index: 10; min-height: 44px; flex-wrap: wrap; }
  .toolbar button { background: #0f3460; color: #fff; border: 2px solid #4dabf7; padding: 6px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; }
  .toolbar button:hover { background: #4dabf7; color: #0f3460; }
  .toolbar button.primario { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .toolbar button.primario:hover { background: #fff; }
  .toolbar .info { font-size: 11px; color: #aaa; margin-left: auto; }
  .toolbar .info span { color: #ffd700; font-weight: bold; }

  /* ===== SCENA — IDENTICA AL GIOCO ===== */
  .area-gioco { position: relative; flex: 1; z-index: 5; overflow: hidden; }
  .scena-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; z-index: 6; }
  .scena { position: relative; width: 1600px; height: 900px; transform-origin: center center; flex-shrink: 0; }

  /* ===== PEDINE — STESSO SVG DEL GIOCO ===== */
  .pedina-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: absolute;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: grab;
    padding: 20px;
    margin: -20px;
  }
  .pedina-wrapper:active { cursor: grabbing; }
  .pedina-wrapper.trascinando { z-index: 100; cursor: grabbing; }
  .pedina-wrapper.selezionata { outline: 2px dashed #ffd700; outline-offset: 8px; border-radius: 8px; }

  .nome-giocatore { font-size: 10px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px #000, 0 0 4px #000, 0 0 2px #000; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); white-space: nowrap; text-align: center; font-family: 'Segoe UI', sans-serif; letter-spacing: 0.3px; pointer-events: none; }
  .pedina-wrapper.tu .nome-giocatore { color: #4dabf7; }
  .pedina-wrapper.cpu .nome-giocatore { color: #ff6b6b; }

  .info-sotto { display: flex; flex-direction: row; gap: 3px; font-size: 10px; line-height: 1; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; font-weight: 900; font-family: 'Courier New', monospace; background: rgba(0,0,0,0.75); padding: 1px 4px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.25); white-space: nowrap; margin-top: 17px; position: relative; }

  .pedina { position: relative; width: 34px; height: 44px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.85)); pointer-events: none; }
  .pedina.cpu svg { transform: scaleX(-1); }

  /* ===== OVERLAY GRIGLIA (per riferimento) ===== */
  .griglia { position: absolute; inset: 0; pointer-events: none; opacity: 0.15; z-index: 2; }
  .griglia::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px); background-size: 80px 80px; }

  /* ===== PANNELLO CONTROLLO MANUALE ===== */
  .pannello-manuale {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(22, 33, 62, 0.98);
    border: 2px solid #ffd700;
    border-radius: 12px;
    padding: 14px 16px;
    z-index: 400;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    font-size: 13px;
    min-width: 260px;
  }
  .pannello-manuale h3 { color: #ffd700; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .pannello-manuale .riga { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pannello-manuale .riga label { width: 30px; color: #aaa; font-weight: bold; }
  .pannello-manuale .riga input { flex: 1; background: #0a0a15; border: 2px solid #0f3460; color: #4ade80; padding: 6px 10px; border-radius: 6px; font-family: 'Courier New', monospace; font-size: 14px; font-weight: bold; text-align: center; }
  .pannello-manuale .riga input:focus { outline: none; border-color: #4dabf7; }
  .pannello-manuale .azioni { display: flex; gap: 8px; margin-top: 10px; }
  .pannello-manuale .azioni button { flex: 1; padding: 8px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; border: 2px solid; }
  .pannello-manuale .azioni button.conferma { background: #22c55e; color: #0a0a15; border-color: #22c55e; }
  .pannello-manuale .azioni button.conferma:hover { background: #4ade80; }
  .pannello-manuale .azioni button.annulla { background: #8B2020; color: #fff; border-color: #ff6b6b; }
  .pannello-manuale .azioni button.annulla:hover { background: #ff6b6b; }
  .pannello-manuale .target-info { font-size: 11px; color: #ffd700; background: rgba(255,215,0,0.1); padding: 6px 8px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid #ffd700; }
  .pannello-manuale .target-info span { color: #fff; font-weight: bold; }
  .pannello-manuale .target-info.vuoto { color: #888; border-left-color: #555; background: rgba(255,255,255,0.05); }

  /* Modale */
  .modale { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 999; display: none; align-items: center; justify-content: center; }
  .modale.aperto { display: flex; }
  .modale-box { background: #16213e; border: 3px solid #ffd700; border-radius: 14px; padding: 20px; max-width: 800px; width: 92%; max-height: 90vh; overflow-y: auto; }
  .modale-box h2 { color: #ffd700; margin-bottom: 12px; }
  .modale-box textarea { width: 100%; height: 400px; background: #0a0a15; color: #4ade80; border: 2px solid #0f3460; border-radius: 8px; padding: 12px; font-family: 'Courier New', monospace; font-size: 11px; resize: vertical; }
  .modale-box .azioni { display: flex; gap: 10px; margin-top: 12px; }
  .modale-box .azioni button { padding: 10px 20px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; background: #0f3460; color: #fff; border: 2px solid #4dabf7; }
  .modale-box .azioni button.primario { background: #ffd700; color: #16213e; border: 2px solid #ffd700; }
</style>
</head>
<body>

<!-- SFONDO STADIO — IDENTICO AL GIOCO -->
<div class="stadio-sfondo"></div>

<div class="app">
  <!-- TOOLBAR -->
  <div class="toolbar">
    <button class="primario" onclick="esportaJSON()">📋 ESPORTA JSON</button>
    <button onclick="resetPosizioni()">🔄 RESET</button>
    <button onclick="toggleGriglia()">🔲 Griglia</button>
    <div class="info">
      Trascina i giocatori · Click dx = ruota 45° · <span id="pos-corrente">—</span>
    </div>
  </div>

  <!-- SCENA -->
  <div class="area-gioco">
    <div class="scena-wrapper" id="scena-wrapper">
      <div class="scena" id="scena">
        <div class="griglia" id="griglia"></div>
      </div>
    </div>
  </div>
</div>

<!-- PANNELLO CONTROLLO MANUALE -->
<div class="pannello-manuale">
  <h3>🎯 Controllo Manuale</h3>
  <div class="target-info vuoto" id="target-info">
    Nessuna selezione — clicca su una pedina
  </div>
  <div class="riga">
    <label>X</label>
    <input type="number" id="input-x" min="0" max="1600" step="1" placeholder="0-1600" disabled>
  </div>
  <div class="riga">
    <label>Y</label>
    <input type="number" id="input-y" min="0" max="900" step="1" placeholder="0-900" disabled>
  </div>
  <div class="azioni">
    <button class="conferma" id="btn-conferma" onclick="confermaPosizione()" disabled>✅ CONFERMA</button>
    <button class="annulla" onclick="annullaSelezione()">✖ DESELEZIONA</button>
  </div>
</div>

<!-- MODALE EXPORT -->
<div class="modale" id="modale-export">
  <div class="modale-box">
    <h2>📋 JSON Posizioni (in PIXEL 1600x900)</h2>
    <p style="font-size:12px;color:#aaa;margin-bottom:10px">Copia questo codice e incollalo nel gioco.</p>
    <textarea id="output-json" readonly></textarea>
    <div class="azioni">
      <button class="primario" onclick="copiaJSON()">📋 COPIA</button>
      <button onclick="chiudiModale()">CHIUDI</button>
    </div>
  </div>
</div>

<script src="divise.js"></script>
<script>
/* ============================================================
   STESSA CONFIGURAZIONE DEL GIOCO
   ============================================================ */
var SCENA_W = 1600;
var SCENA_H = 900;
var scalaCorrente = 1;

var DISTANZA_COPPIA_PX = 50;

/* Squadre di esempio: TU = Juventus, CPU = Napoli */
var SQ_TU = 'juventus';
var SQ_CPU = 'napoli';

/* Nomi giocatori — TU (Juventus) e CPU (Napoli) */
var NOMI_TU_MOVIMENTO = ['Bremer', 'Gatti', 'Locatelli', 'Koopmeiners', 'Thuram', 'McKennie', 'Douglas Luiz', 'Miretti', 'Cambiaso', 'Kalulu'];
var NOMI_CPU_MOVIMENTO = ['Rrahmani', 'Buongiorno', 'De Bruyne', 'McTominay', 'Lobtka', 'Anguissa', 'Gilmour', 'Folorunsho', 'Di Lorenzo', 'Olivera'];

var NOME_POR_TU = 'Vicario';
var NOME_POR_CPU = 'Meret';

/* Divise */
var DIV_TU = SQUADRE[SQ_TU].casa;
var DIV_CPU = SQUADRE[SQ_CPU].casa;
var DIV_POR_TU = SQUADRE[SQ_TU].portiere;
var DIV_POR_CPU = SQUADRE[SQ_CPU].portiere;

/* ============================================================
   POSIZIONI DEFAULT — le stesse che hai in index.html
   ============================================================ */
var POSIZIONI_COPPIE_DEFAULT = [
  { x: 630,  y: 630, angolo: 180 },  // #1  Z1 sup
  { x: 600,  y: 760, angolo: 180 },  // #2  Z2 sup
  { x: 760,  y: 575, angolo: 180 },  // #3  Z3 sup
  { x: 720,  y: 835, angolo: 180 },  // #4  Z4 sup
  { x: 880,  y: 620, angolo: 180 },  // #5  Z5 sup
  { x: 880,  y: 760, angolo: 180 },  // #6  Z1 inf
  { x: 1000, y: 575, angolo: 180 },  // #7  Z2 inf
  { x: 1040, y: 835, angolo: 180 },  // #8  Z3 inf
  { x: 1130, y: 630, angolo: 180 },  // #9  Z4 inf
  { x: 1160, y: 760, angolo: 180 }   // #10 Z5 inf
];

var POSIZIONI_PORTIERI_DEFAULT = [
  { x: 470,  y: 640, squadra: 'tu'  },
  { x: 1210, y: 640, squadra: 'cpu' }
];

var posizioni = JSON.parse(JSON.stringify(POSIZIONI_COPPIE_DEFAULT));
var posizioniPortieri = JSON.parse(JSON.stringify(POSIZIONI_PORTIERI_DEFAULT));
var ultimaSelezione = null;

/* ============================================================
   RENDER
   ============================================================ */
function adattaScena() {
  var scena = document.getElementById('scena');
  var wrapper = document.getElementById('scena-wrapper');
  if (!scena || !wrapper) return;
  var w = wrapper.clientWidth, h = wrapper.clientHeight;
  if (w === 0 || h === 0) return;
  scalaCorrente = Math.min(w / SCENA_W, h / SCENA_H);
  scena.style.transform = 'scale(' + scalaCorrente + ')';
}
window.addEventListener('resize', adattaScena);
window.addEventListener('orientationchange', function() { setTimeout(adattaScena, 250); });

function creaNomeGiocatore(nome, sq) {
  var el = document.createElement('div');
  el.className = 'nome-giocatore';
  el.textContent = nome;
  return el;
}

function creaInfoSotto() {
  var el = document.createElement('div');
  el.className = 'info-sotto';
  el.innerHTML = '<span style="color:#4ade80">20</span> <span style="color:#555">0</span> <span style="color:#555">·</span>';
  return el;
}

function creaPedinaEl(divisa, sq) {
  var el = document.createElement('div');
  el.className = 'pedina ' + sq;
  el.innerHTML = creaGiocatoreSVG(divisa, 'fermo');
  return el;
}

function disegnaCampo() {
  var scena = document.getElementById('scena');
  /* Rimuovi solo le pedine (mantieni griglia) */
  var vecchie = scena.querySelectorAll('.pedina-wrapper');
  for (var i = 0; i < vecchie.length; i++) vecchie[i].remove();

  /* ========== 1) DISEGNA LE 10 COPPIE ========== */
  for (var idx = 0; idx < posizioni.length; idx++) {
    var p = posizioni[idx];

    var coppia = document.createElement('div');
    coppia.className = 'coppia-render';
    coppia.style.position = 'absolute';
    coppia.style.left = p.x + 'px';
    coppia.style.top = p.y + 'px';
    coppia.style.transform = 'translate(-50%, -50%)';
    coppia.style.zIndex = '10';
    coppia.style.pointerEvents = 'none';

    var rad = p.angolo * Math.PI / 180;
    var dx = Math.cos(rad) * (DISTANZA_COPPIA_PX / 2);
    var dy = Math.sin(rad) * (DISTANZA_COPPIA_PX / 2);

    /* --- Pedina TU (a sinistra: -dx, -dy) --- */
    var wrapTU = document.createElement('div');
    wrapTU.className = 'pedina-wrapper tu';
    wrapTU.dataset.idx = idx;
    wrapTU.dataset.tipo = 'coppia-tu';
    wrapTU.style.position = 'absolute';
    wrapTU.style.left = (-dx) + 'px';
    wrapTU.style.top = (-dy) + 'px';
    wrapTU.style.transform = 'translate(-50%, -50%)';
    wrapTU.style.pointerEvents = 'auto';
    wrapTU.appendChild(creaNomeGiocatore(NOMI_TU_MOVIMENTO[idx]));
    wrapTU.appendChild(creaPedinaEl(DIV_TU, 'tu'));
    wrapTU.appendChild(creaInfoSotto());
    abilitaDrag(wrapTU, idx, 'coppia-tu');
    coppia.appendChild(wrapTU);

    /* --- Pedina CPU (a destra: +dx, +dy) --- */
    var wrapCPU = document.createElement('div');
    wrapCPU.className = 'pedina-wrapper cpu';
    wrapCPU.dataset.idx = idx;
    wrapCPU.dataset.tipo = 'coppia-cpu';
    wrapCPU.style.position = 'absolute';
    wrapCPU.style.left = (dx) + 'px';
    wrapCPU.style.top = (dy) + 'px';
    wrapCPU.style.transform = 'translate(-50%, -50%)';
    wrapCPU.style.pointerEvents = 'auto';
    wrapCPU.appendChild(creaNomeGiocatore(NOMI_CPU_MOVIMENTO[idx]));
    wrapCPU.appendChild(creaPedinaEl(DIV_CPU, 'cpu'));
    wrapCPU.appendChild(creaInfoSotto());
    abilitaDrag(wrapCPU, idx, 'coppia-cpu');
    coppia.appendChild(wrapCPU);

    scena.appendChild(coppia);
  }

  /* ========== 2) DISEGNA I 2 PORTIERI ========== */
  for (var k = 0; k < posizioniPortieri.length; k++) {
    var pp = posizioniPortieri[k];
    var wrapPor = document.createElement('div');
    wrapPor.className = 'pedina-wrapper ' + pp.squadra;
    wrapPor.dataset.idx = k;
    wrapPor.dataset.tipo = 'portiere';
    wrapPor.style.position = 'absolute';
    wrapPor.style.left = pp.x + 'px';
    wrapPor.style.top = pp.y + 'px';
    wrapPor.style.transform = 'translate(-50%, -50%)';
    wrapPor.style.pointerEvents = 'auto';
    wrapPor.appendChild(creaNomeGiocatore(pp.squadra === 'tu' ? NOME_POR_TU : NOME_POR_CPU));
    wrapPor.appendChild(creaPedinaEl(pp.squadra === 'tu' ? DIV_POR_TU : DIV_POR_CPU, pp.squadra));
    wrapPor.appendChild(creaInfoSotto());
    abilitaDrag(wrapPor, k, 'portiere');
    scena.appendChild(wrapPor);
  }
}

/* ============================================================
   DRAG
   ============================================================ */
function abilitaDrag(el, idx, tipo) {
  var dragging = false;
  var startX, startY, startLeftPx, startTopPx;

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });

  function onDown(e) {
    if (e.button === 2) return;
    e.preventDefault();
    e.stopPropagation();
    dragging = true;
    el.classList.add('trascinando');

    var pt = getPoint(e);
    startX = pt.x; startY = pt.y;

    /* Determina se stiamo muovendo una coppia o un portiere */
    if (tipo === 'portiere') {
      startLeftPx = posizioniPortieri[idx].x;
      startTopPx = posizioniPortieri[idx].y;
    } else {
      startLeftPx = posizioni[idx].x;
      startTopPx = posizioni[idx].y;
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);

    ultimaSelezione = { tipo: tipo, idx: idx };
    aggiornaPannello();
    aggiornaSelezionati();
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var pt = getPoint(e);
    var deltaXPx = (pt.x - startX) / scalaCorrente;
    var deltaYPx = (pt.y - startY) / scalaCorrente;
    var newX = Math.max(0, Math.min(1600, startLeftPx + deltaXPx));
    var newY = Math.max(0, Math.min(900, startTopPx + deltaYPx));

    if (tipo === 'portiere') {
      posizioniPortieri[idx].x = Math.round(newX);
      posizioniPortieri[idx].y = Math.round(newY);
      el.style.left = posizioniPortieri[idx].x + 'px';
      el.style.top = posizioniPortieri[idx].y + 'px';
    } else {
      /* Movimento coppia: sposta il centro, che è uguale per TU e CPU */
      posizioni[idx].x = Math.round(newX);
      posizioni[idx].y = Math.round(newY);
      /* Aggiorna il contenitore padre */
      var coppia = el.parentNode;
      coppia.style.left = posizioni[idx].x + 'px';
      coppia.style.top = posizioni[idx].y + 'px';
    }
    aggiornaPannello();
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('trascinando');
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchend', onUp);
  }

  function getPoint(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }
}

/* ============================================================
   SELEZIONE E PANNELLO
   ============================================================ */
function aggiornaSelezionati() {
  var tutti = document.querySelectorAll('.pedina-wrapper');
  for (var i = 0; i < tutti.length; i++) tutti[i].classList.remove('selezionata');
  if (!ultimaSelezione) return;
  var el = document.querySelector('.pedina-wrapper[data-tipo="' + ultimaSelezione.tipo + '"][data-idx="' + ultimaSelezione.idx + '"]');
  if (el) el.classList.add('selezionata');
}

function aggiornaPannello() {
  var info = document.getElementById('target-info');
  var inputX = document.getElementById('input-x');
  var inputY = document.getElementById('input-y');
  var btn = document.getElementById('btn-conferma');

  if (!ultimaSelezione) {
    info.className = 'target-info vuoto';
    info.innerHTML = 'Nessuna selezione — clicca su una pedina';
    inputX.value = ''; inputY.value = '';
    inputX.disabled = true; inputY.disabled = true;
    btn.disabled = true;
    return;
  }

  var p, nome;
  if (ultimaSelezione.tipo === 'portiere') {
    p = posizioniPortieri[ultimaSelezione.idx];
    nome = 'Portiere ' + p.squadra.toUpperCase();
  } else {
    p = posizioni[ultimaSelezione.idx];
    nome = 'Coppia #' + (ultimaSelezione.idx + 1) + ' (TU + CPU)';
  }

  info.className = 'target-info';
  info.innerHTML = 'Selezionato: <span>' + nome + '</span>';
  inputX.value = p.x;
  inputY.value = p.y;
  inputX.disabled = false;
  inputY.disabled = false;
  btn.disabled = false;
}

function confermaPosizione() {
  if (!ultimaSelezione) return;
  var newX = parseInt(document.getElementById('input-x').value);
  var newY = parseInt(document.getElementById('input-y').value);
  if (isNaN(newX) || isNaN(newY)) { alert('❌ Inserisci valori numerici validi.'); return; }
  newX = Math.max(0, Math.min(1600, newX));
  newY = Math.max(0, Math.min(900, newY));

  if (ultimaSelezione.tipo === 'portiere') {
    posizioniPortieri[ultimaSelezione.idx].x = newX;
    posizioniPortieri[ultimaSelezione.idx].y = newY;
  } else {
    posizioni[ultimaSelezione.idx].x = newX;
    posizioni[ultimaSelezione.idx].y = newY;
  }
  disegnaCampo();
  aggiornaPannello();
  aggiornaSelezionati();
}

function annullaSelezione() {
  ultimaSelezione = null;
  aggiornaPannello();
  aggiornaSelezionati();
  document.getElementById('pos-corrente').textContent = '—';
}

/* ============================================================
   ROTAZIONE COPPIA
   ============================================================ */
document.addEventListener('contextmenu', function(e) {
  var el = e.target.closest('.pedina-wrapper');
  if (!el) return;
  e.preventDefault();
  var tipo = el.dataset.tipo;
  var idx = parseInt(el.dataset.idx);
  if (tipo === 'portiere') return;
  posizioni[idx].angolo = (posizioni[idx].angolo + 45) % 360;
  disegnaCampo();
  aggiornaSelezionati();
});

/* ============================================================
   TOOLBAR
   ============================================================ */
function esportaJSON() {
  var out =
    '/* 10 coppie di movimento (indice 0-9) — coordinate in PIXEL (1600x900) */\n' +
    'var POSIZIONI_COPPIE = ' + JSON.stringify(posizioni, null, 2) + ';\n\n' +
    '/* 2 portieri singoli (0 = TU, 1 = CPU) — coordinate in PIXEL */\n' +
    'var POSIZIONI_PORTIERI = ' + JSON.stringify(posizioniPortieri, null, 2) + ';';
  document.getElementById('output-json').value = out;
  document.getElementById('modale-export').classList.add('aperto');
}
function copiaJSON() {
  var ta = document.getElementById('output-json');
  ta.select();
  document.execCommand('copy');
  alert('✅ JSON copiato negli appunti!');
}
function chiudiModale() { document.getElementById('modale-export').classList.remove('aperto'); }
function resetPosizioni() {
  if (!confirm('Vuoi resettare tutte le posizioni?')) return;
  posizioni = JSON.parse(JSON.stringify(POSIZIONI_COPPIE_DEFAULT));
  posizioniPortieri = JSON.parse(JSON.stringify(POSIZIONI_PORTIERI_DEFAULT));
  ultimaSelezione = null;
  aggiornaPannello();
  disegnaCampo();
}
function toggleGriglia() {
  var g = document.getElementById('griglia');
  g.style.display = g.style.display === 'none' ? 'block' : 'none';
}
