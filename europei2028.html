<!DOCTYPE html>
<html lang="it">

<title>Europei 2028 - Qualificazioni</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a15;

  .app { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .header {
    background: linear-gradient(135deg, #16213e, #0f3460);

    text-align: center;

    display: grid;

  .btn {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;

  .btn:hover { background: #4dabf7; color: #0f3460; }

  .match-row.tua { background: rgba(77,171,247,0.2); border-radius: 4px; }

    background: #ffd700; color: #16213e; border: none;

  .torna-menu {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: #0f3460; border: 2px solid #4dabf7; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;

  }
  .torna-menu:hover { background: #4dabf7; color: #0f3460; }
  .nascosto { display: none !important; }
  .avviso {
    background: rgba(255,215,0,0.15); border: 1px solid #ffd700;
    border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #ffd700;
    margin: 10px 0;
  }
  .loading {
    text-align: center; padding: 40px; color: #ffd700; font-size: 14px;
  }
  .loading .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid rgba(255,215,0,0.3); border-top-color: #ffd700;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prossima-partita {
    background: linear-gradient(135deg, #ffd700, #f59f00);
    border-radius: 10px; padding: 14px; margin: 14px 0;

  .prossima-partita .vs { font-size: 20px; font-weight: 900; margin: 8px 0; letter-spacing: 2px; }
  .prossima-partita .info { font-size: 11px; margin-bottom: 8px; }
  .prossima-partita .play-big {
    background: #16213e; color: #ffd700; border: none;

  .prossima-partita .play-big:hover { background: #000; }
  .reset-btn {
    position: fixed; top: 10px; right: 10px; z-index: 20;
    background: #8B2020; border: 2px solid #ff6b6b; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
    font-size: 12px;
  }
  .reset-btn:hover { background: #ff6b6b; }
</style>
</head>
<body>
<button class="torna-menu" onclick="location.href='index.html'">← Menù</button>
<button class="reset-btn" onclick="resetTorneo()">🗑 Reset</button>
<div class="app">
  <div class="header">
    <h1>🏆 EUROPEI 2028</h1>
    <p>Qualificazioni · Spareggi · Fase Finale</p>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Caricamento...</div>
    </div>
  </div>
</div>

<script src="divise.js"></script>
<script>
/* =========================================================
   STATO TORNEO
   ========================================================= */
const STORAGE_KEY = 'europei2028_stato';

let torneo = {
  squadraScelta: null,
  fase: 'scelta', // scelta | qualificazioni | spareggi | ottavi | quarti | semifinali | finale | fine
  gironi: {},        // { A: [sq1, sq2, sq3, sq4], ... }
  partite: [],       // Tutte le partite: { id, girone, andata: {casa, trasferta, golCasa, golTrasferta, played}, ritorno: {...} }
  classifica: {},    // { A: [{squadra, punti, giocate, vinte, pareggi, perse, gf, gs, dr}, ...] }
  qualificate: [],
  spareggi: [],
  tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
  prossimaPartita: null // { tipo: 'girone'|'spareggio'|'ottavi'|..., id, casa, trasferta }
};

/* =========================================================
   INIZIALIZZAZIONE
   ========================================================= */
const GRUPPI_NOMI = ['A','B','C','D','E','F','G','H','I','J','K','L'];

function caricaStato() {
  const salvato = localStorage.getItem(STORAGE_KEY);
  if (salvato) {
    try {
      torneo = JSON.parse(salvato);
      return true;
    } catch (e) { return false; }
  }
  return false;
}
function salvaStato() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(torneo));
}
function resetTorneo() {
  if (confirm('Sei sicuro di voler resettare il torneo? Perderai tutti i progressi.')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

/* =========================================================
   CREAZIONE TORNEO
   ========================================================= */
function creaGironi() {
  const ids = Object.keys(SQUADRE);
  // Mescola le squadre
  const mescolate = [...ids].sort(() => Math.random() - 0.5);

  // 54 squadre / 12 gironi = 4.5 → facciamo 6 gironi da 4 e 6 gironi da 5 = 24 + 30 = 54
  const gironi = {};
  let idx = 0;
  GRUPPI_NOMI.forEach((nome, i) => {
    const numSquadre = i < 6 ? 5 : 4; // 6 gironi da 5, 6 gironi da 4
    gironi[nome] = mescolate.slice(idx, idx + numSquadre);
    idx += numSquadre;
  });
  return gironi;
}

function creaPartiteGirone(gironi) {
  const partite = [];
  let idPartita = 0;
  for (const nome of GRUPPI_NOMI) {
    const squadre = gironi[nome];
    // Genera accoppiamenti andata/ritorno
    for (let i = 0; i < squadre.length; i++) {
      for (let j = i + 1; j < squadre.length; j++) {
        // Sorteggio casa/trasferta per l'andata
        const casaAndata = Math.random() < 0.5 ? squadre[i] : squadre[j];
        const trasfertaAndata = casaAndata === squadre[i] ? squadre[j] : squadre[i];
        partite.push({
          id: 'gir_' + nome + '_' + (idPartita++),
          girone: nome,
          andata: { casa: casaAndata, trasferta: trasfertaAndata, golCasa: null, golTrasferta: null, played: false },
          ritorno: { casa: trasfertaAndata, trasferta: casaAndata, golCasa: null, golTrasferta: null, played: false }
        });
      }
    }
  }
  return partite;
}

function inizializzaTorneo(squadraScelta) {
  torneo = {
    squadraScelta: squadraScelta,
    fase: 'qualificazioni',
    gironi: {},
    partite: [],
    classifica: {},
    qualificate: [],
    spareggi: [],
    tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
    prossimaPartita: null
  };
  torneo.gironi = creaGironi();
  torneo.partite = creaPartiteGirone(torneo.gironi);
  // Inizializza classifiche
  for (const nome of GRUPPI_NOMI) {
    torneo.classifica[nome] = torneo.gironi[nome].map(sq => ({
      squadra: sq, punti: 0, giocate: 0, vinte: 0, pareggi: 0, perse: 0, gf: 0, gs: 0, dr: 0
    }));
  }
  calcolaProssimaPartita();
  salvaStato();
  render();
}

/* =========================================================
   TROVA LA PROSSIMA PARTITA DELLA TUA SQUADRA
   ========================================================= */
function calcolaProssimaPartita() {
  const tua = torneo.squadraScelta;
  if (!tua) { torneo.prossimaPartita = null; return; }

  if (torneo.fase === 'qualificazioni') {
    // Cerca la prima partita non giocata della tua squadra
    for (const p of torneo.partite) {
      if (!p.andata.played && (p.andata.casa === tua || p.andata.trasferta === tua)) {
        torneo.prossimaPartita = { tipo: 'girone', id: p.id, sotto: 'andata', casa: p.andata.casa, trasferta: p.andata.trasferta, girone: p.girone };
        return;
      }
      if (!p.ritorno.played && (p.ritorno.casa === tua || p.ritorno.trasferta === tua)) {
        torneo.prossimaPartita = { tipo: 'girone', id: p.id, sotto: 'ritorno', casa: p.ritorno.casa, trasferta: p.ritorno.trasferta, girone: p.girone };
        return;
      }
    }
    torneo.prossimaPartita = null;
  } else if (torneo.fase === 'spareggi') {
    // Trova spareggio con la tua squadra
    for (const s of torneo.spareggi) {
      if ((s.casa === tua || s.trasferta === tua) && !s.played) {
        torneo.prossimaPartita = { tipo: 'spareggio', id: s.id, casa: s.casa, trasferta: s.trasferta };
        return;
      }
    }
    torneo.prossimaPartita = null;
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase];
    if (!turno) { torneo.prossimaPartita = null; return; }
    for (const p of turno) {
      if ((p.casa === tua || p.trasferta === tua) && (!p.played && !p.playedRitorno)) {
        if (!p.played) {
          torneo.prossimaPartita = { tipo: torneo.fase, id: p.id, sotto: 'andata', casa: p.casa, trasferta: p.trasferta };
        } else if (!p.playedRitorno) {
          torneo.prossimaPartita = { tipo: torneo.fase, id: p.id, sotto: 'ritorno', casa: p.trasferta, trasferta: p.casa };
        }
        return;
      }
    }
    torneo.prossimaPartita = null;
  }
}

/* =========================================================
   SIMULAZIONE PARTITA
   ========================================================= */
function forzaSquadra(id) {
  const forza = {
    italia: 90, francia: 92, germania: 88, spagna: 91, portogallo: 87,
    inghilterra: 89, olanda: 85, belgio: 84, croazia: 83, danimarca: 82,
    svizzera: 80, austria: 79, polonia: 78, ucraina: 77, turchia: 76,
    svezia: 75, norvegia: 74, scozia: 73, galles: 72, irlanda: 71,
    serbia: 70, ungheria: 69, romania: 68, grecia: 67, cechia: 66,
    slovacchia: 65, slovenia: 64, finlandia: 63, islanda: 62, albania: 61,
    bosnia: 60, macedonia: 59, montenegro: 58, bulgaria: 57, bielorussia: 56,
    georgia: 55, armenia: 54, azerbaigian: 53, kazakistan: 52, cipro: 51,
    malta: 50, lussemburgo: 49, estonia: 48, lettonia: 47, lituania: 46,
    moldavia: 45, kosovo: 44, faroe: 43, andorra: 42, sanmarino: 41,
    gibilterra: 40, liechtenstein: 39, russia: 80
  };
  return forza[id] || 50;
}

function simulaPartita(a, b, casaA = true) {
  const fa = forzaSquadra(a) + (casaA ? 5 : 0);
  const fb = forzaSquadra(b) + (casaA ? 0 : 5);
  const pa = fa / (fa + fb);
  const golA = Math.random() < pa ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  const golB = Math.random() < (1 - pa) ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  return { golA, golB };
}

/* =========================================================
   AGGIORNA CLASSIFICA
   ========================================================= */
function aggiornaClassifica(girone, casa, trasferta, golCasa, golTrasferta) {
  const cls = torneo.classifica[girone];
  const c = cls.find(x => x.squadra === casa);
  const t = cls.find(x => x.squadra === trasferta);
  c.giocate++; t.giocate++;
  c.gf += golCasa; c.gs += golTrasferta;
  t.gf += golTrasferta; t.gs += golCasa;
  if (golCasa > golTrasferta) { c.punti += 3; c.vinte++; t.perse++; }
  else if (golCasa < golTrasferta) { t.punti += 3; t.vinte++; c.perse++; }
  else { c.punti += 1; t.punti += 1; c.pareggi++; t.pareggi++; }
  c.dr = c.gf - c.gs;
  t.dr = t.gf - t.gs;
  cls.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

/* =========================================================
   GIOCA PARTITA (link a index.html)
   ========================================================= */
function giocaPartita(tipo, idPartita, sotto, casa, trasferta) {
  // Salva i dati della partita attiva
  const datiPartita = {
    sqTU: casa === torneo.squadraScelta ? casa : trasferta,
    sqCPU: casa === torneo.squadraScelta ? trasferta : casa,
    tipo: tipo,
    idPartita: idPartita,
    sotto: sotto,
    casaOriginale: casa,
    trasfertaOriginale: trasferta
  };
  localStorage.setItem('torneo_partita_attiva_' + idPartita + '_' + sotto, JSON.stringify(datiPartita));
  // Vai al gioco
  location.href = 'index.html?torneo=europei&partita=' + encodeURIComponent(idPartita + '_' + sotto);
}

/* =========================================================
   RICEZIONE RISULTATO DA index.html
   ========================================================= */
function riceviRisultato() {
  const urlParams = new URLSearchParams(window.location.search);
  const risultatoId = urlParams.get('risultato');
  if (!risultatoId) return false;

  const key = 'torneo_partita_' + risultatoId;
  const risultatoJson = localStorage.getItem(key);
  if (!risultatoJson) return false;

  const risultato = JSON.parse(risultatoJson);
  localStorage.removeItem(key);

  // Parsing id: "gir_A_0_andata" oppure "spareggio_0"
  const parti = risultatoId.split('_');
  if (parti[0] === 'gir') {
    // Partita di girone: gir_A_0_andata
    const girone = parti[1];
    const idPartita = 'gir_' + parti[1] + '_' + parti[2];
    const sotto = parti[3];
    const partita = torneo.partite.find(p => p.id === idPartita);
    if (!partita) return false;
    const datiAttivi = JSON.parse(localStorage.getItem('torneo_partita_attiva_' + risultatoId) || '{}');
    const sqTU = datiAttivi.sqTU;
    const sqCPU = datiAttivi.sqCPU;
    const golTU = risultato.golTU;
    const golCPU = risultato.golCPU;
    // Determina chi è casa e chi trasferta
    const casa = datiAttivi.casaOriginale;
    const trasferta = datiAttivi.trasfertaOriginale;
    const golCasa = casa === sqTU ? golTU : golCPU;
    const golTrasferta = casa === sqTU ? golCPU : golTU;
    partita[sotto].golCasa = golCasa;
    partita[sotto].golTrasferta = golTrasferta;
    partita[sotto].played = true;
    aggiornaClassifica(girone, casa, trasferta, golCasa, golTrasferta);
  } else if (parti[0] === 'spareggio') {
    const idPartita = 'spareggio_' + parti[1];
    const sotto = parti[2] || 'unica';
    const s = torneo.spareggi.find(x => x.id === idPartita);
    if (!s) return false;
    const datiAttivi = JSON.parse(localStorage.getItem('torneo_partita_attiva_' + risultatoId) || '{}');
    s.golCasa = datiAttivi.casaOriginale === datiAttivi.sqTU ? risultato.golTU : risultato.golCPU;
    s.golTrasferta = datiAttivi.casaOriginale === datiAttivi.sqTU ? risultato.golCPU : risultato.golTU;
    s.played = true;
  } else {
    // Fase finale: ottavi_0_andata
    const turno = parti[0];
    const index = parseInt(parti[1]);
    const sotto = parti[2];
    const p = torneo.tabellone[turno]?.[index];
    if (!p) return false;
    const datiAttivi = JSON.parse(localStorage.getItem('torneo_partita_attiva_' + risultatoId) || '{}');
    const golCasa = datiAttivi.casaOriginale === datiAttivi.sqTU ? risultato.golTU : risultato.golCPU;
    const golTrasferta = datiAttivi.casaOriginale === datiAttivi.sqTU ? risultato.golCPU : risultato.golTU;
    if (sotto === 'andata') {
      p.golCasaAndata = golCasa;
      p.golTrasfertaAndata = golTrasferta;
      p.played = true;
    } else {
      p.golCasaRitorno = golCasa;
      p.golTrasfertaRitorno = golTrasferta;
      p.playedRitorno = true;
    }
  }

  // Pulisci URL
  window.history.replaceState({}, document.title, 'europei2028.html');
  salvaStato();
  return true;
}

/* =========================================================
   SIMULAZIONE ALTRE PARTITE
   ========================================================= */
function simulaAltrePartite() {
  const tua = torneo.squadraScelta;
  if (torneo.fase === 'qualificazioni') {
    for (const p of torneo.partite) {
      if (!p.andata.played && p.andata.casa !== tua && p.andata.trasferta !== tua) {
        const r = simulaPartita(p.andata.casa, p.andata.trasferta, true);
        p.andata.golCasa = r.golA;
        p.andata.golTrasferta = r.golB;
        p.andata.played = true;
        aggiornaClassifica(p.girone, p.andata.casa, p.andata.trasferta, r.golA, r.golB);
      }
      if (!p.ritorno.played && p.ritorno.casa !== tua && p.ritorno.trasferta !== tua) {
        const r = simulaPartita(p.ritorno.casa, p.ritorno.trasferta, true);
        p.ritorno.golCasa = r.golA;
        p.ritorno.golTrasferta = r.golB;
        p.ritorno.played = true;
        aggiornaClassifica(p.girone, p.ritorno.casa, p.ritorno.trasferta, r.golA, r.golB);
      }
    }
  }
}

/* =========================================================
   VERIFICA FINE FASE
   ========================================================= */
function controllaFineFase() {
  if (torneo.fase === 'qualificazioni') {
    const tutteGiocate = torneo.partite.every(p => p.andata.played && p.ritorno.played);
    if (tutteGiocate) {
      // Calcola qualificate: prime 2 di ogni girone + migliori terze
      const primeDue = [];
      const terze = [];
      for (const nome of GRUPPI_NOMI) {
        const cls = torneo.classifica[nome];
        if (cls[0]) primeDue.push(cls[0].squadra);
        if (cls[1]) primeDue.push(cls[1].squadra);
        if (cls[2]) terze.push({ squadra: cls[2].squadra, punti: cls[2].punti, dr: cls[2].dr, gf: cls[2].gf });
      }
      // Ordina le terze
      terze.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
      // Prendi le migliori 4 terze
      const miglioriTerze = terze.slice(0, 4).map(t => t.squadra);
      torneo.qualificate = [...primeDue, ...miglioriTerze];
      // Crea tabellone ottavi (16 squadre)
      const mescolate = [...torneo.qualificate].sort(() => Math.random() - 0.5);
      torneo.tabellone.ottavi = [];
      for (let i = 0; i < 8; i++) {
        torneo.tabellone.ottavi.push({
          id: 'ottavi_' + i,
          casa: mescolate[i * 2],
          trasferta: mescolate[i * 2 + 1],
          played: false, playedRitorno: false,
          golCasaAndata: null, golTrasfertaAndata: null,
          golCasaRitorno: null, golTrasfertaRitorno: null
        });
      }
      torneo.fase = 'ottavi';
    }
  } else if (['ottavi','quarti','semifinali'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase];
    const tutteGiocate = turno.every(p => p.played && p.playedRitorno);
    if (tutteGiocate) {
      // Calcola vincitori
      const vincitori = [];
      for (const p of turno) {
        const totCasa = (p.golCasaAndata || 0) + (p.golCasaRitorno || 0);
        const totTrasferta = (p.golTrasfertaAndata || 0) + (p.golTrasfertaRitorno || 0);
        if (totCasa > totTrasferta) vincitori.push(p.casa);
        else if (totTrasferta > totCasa) vincitori.push(p.trasferta);
        else {
          // Pareggio: rigori (random)
          vincitori.push(Math.random() < 0.5 ? p.casa : p.trasferta);
        }
      }
      // Crea turno successivo
      let prossimoTurno;
      if (torneo.fase === 'ottavi') prossimoTurno = 'quarti';
      else if (torneo.fase === 'quarti') prossimoTurno = 'semifinali';
      else if (torneo.fase === 'semifinali') prossimoTurno = 'finale';
      torneo.tabellone[prossimoTurno] = [];
      const numPartite = vincitori.length / 2;
      for (let i = 0; i < numPartite; i++) {
        const a = vincitori[i * 2], b = vincitori[i * 2 + 1];
        const casaAndata = Math.random() < 0.5 ? a : b;
        const trasfertaAndata = casaAndata === a ? b : a;
        torneo.tabellone[prossimoTurno].push({
          id: prossimoTurno + '_' + i,
          casa: casaAndata,
          trasferta: trasfertaAndata,
          played: false, playedRitorno: false,
          golCasaAndata: null, golTrasfertaAndata: null,
          golCasaRitorno: null, golTrasfertaRitorno: null
        });
      }
      torneo.fase = prossimoTurno;
    }
  } else if (torneo.fase === 'finale') {
    const p = torneo.tabellone.finale[0];
    if (p.played && p.playedRitorno) {
      // Calcola vincitore finale (partita secca: prendi il ritorno)
      const totCasa = (p.golCasaAndata || 0) + (p.golCasaRitorno || 0);
      const totTrasferta = (p.golTrasfertaAndata || 0) + (p.golTrasfertaRitorno || 0);
      if (totCasa > totTrasferta) p.vincitore = p.casa;
      else if (totTrasferta > totCasa) p.vincitore = p.trasferta;
      else p.vincitore = Math.random() < 0.5 ? p.casa : p.trasferta;
      torneo.fase = 'fine';
    }
  }
  calcolaProssimaPartita();
  salvaStato();
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const content = document.getElementById('content');
  if (torneo.fase === 'scelta') {
    renderScelta(content);
  } else if (torneo.fase === 'fine') {
    renderFine(content);
  } else {
    renderTorneo(content);
  }
}

function renderScelta(content) {
  let html = `<div class="fase-titolo">Scegli la tua squadra</div>
    <div class="avviso">Seleziona una nazionale per iniziare le qualificazioni agli Europei 2028.</div>
    <div class="squadre-grid">`;
  Object.keys(SQUADRE).forEach(id => {
    html += `<div class="squadra-btn ${id === torneo.squadraScelta ? 'selezionata' : ''}" onclick="selezionaSquadra('${id}')">
      <div class="maglia">${creaGiocatoreSVG(SQUADRE[id].casa, 'fermo')}</div>
      <div>${SQUADRE[id].nome}</div>
    </div>`;
  });
  html += `</div>`;
  if (torneo.squadraScelta) {
    html += `<div style="text-align:center;margin-top:16px">
      <button class="btn primario" onclick="iniziaQualificazioni()">INIZIA QUALIFICAZIONI</button>
    </div>`;
  }
  content.innerHTML = html;
}

function selezionaSquadra(id) {
  torneo.squadraScelta = id;
  render();
}
function iniziaQualificazioni() {
  inizializzaTorneo(torneo.squadraScelta);
}

function renderTorneo(content) {
  const tua = torneo.squadraScelta;
  let html = `<div class="avviso">La tua squadra: <strong>${SQUADRE[tua].nome}</strong> · Fase: <strong>${torneo.fase.toUpperCase()}</strong></div>`;

  // Prossima partita
  if (torneo.prossimaPartita) {
    const pp = torneo.prossimaPartita;
    const casa = SQUADRE[pp.casa].nome;
    const trasferta = SQUADRE[pp.trasferta].nome;
    html += `<div class="prossima-partita">
      <h3>⚽ PROSSIMA PARTITA</h3>
      <div class="vs">${casa} <span style="font-size:14px">vs</span> ${trasferta}</div>
      <div class="info">${pp.sotto === 'andata' ? 'Andata' : 'Ritorno'} · ${pp.tipo.toUpperCase()}</div>
      <button class="play-big" onclick="giocaPartita('${pp.tipo}', '${pp.id}', '${pp.sotto}', '${pp.casa}', '${pp.trasferta}')">▶ GIOCA</button>
    </div>`;
  } else {
    html += `<div class="prossima-partita" style="background:#16213e;color:#ffd700">
      <h3>⏳ In attesa...</h3>
      <p style="font-size:12px">La tua squadra non ha partite in programma in questa fase.</p>
      <button class="play-big" onclick="simulaAvanti()">SIMULA AVANTI</button>
    </div>`;
  }

  // Fase a gironi
  if (torneo.fase === 'qualificazioni') {
    html += `<div class="fase-titolo">📋 Fase a Gironi — Qualificazioni</div>`;
    html += `<div class="gironi-grid">`;
    for (const nome of GRUPPI_NOMI) {
      const cls = torneo.classifica[nome];
      if (!cls) continue;
      html += `<div class="girone"><h3>Girone ${nome}</h3><table class="classifica">
        <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
      cls.forEach((t, idx) => {
        const isTua = t.squadra === tua ? 'tua' : '';
        const qual = idx < 2 ? 'qualificata' : '';
        html += `<tr class="${isTua} ${qual}">
          <td>${SQUADRE[t.squadra].nome}</td>
          <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
        </tr>`;
      });
      html += `</table></div>`;
    }
    html += `</div>`;
  }

  // Tabellone fase finale
  if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    html += renderTabellone(tua);
  }

  content.innerHTML = html;
}

function renderTabellone(tua) {
  let html = `<div class="fase-titolo">🏆 Fase Finale</div>`;
  const turni = [
    { key: 'ottavi', nome: 'Ottavi di Finale' },
    { key: 'quarti', nome: 'Quarti di Finale' },
    { key: 'semifinali', nome: 'Semifinali' },
    { key: 'finale', nome: 'Finale' }
  ];
  turni.forEach(t => {
    const partite = torneo.tabellone[t.key];
    if (!partite || partite.length === 0) return;
    html += `<div class="turno-box"><h3>${t.nome}</h3>`;
    partite.forEach(p => {
      const isTua = (p.casa === tua || p.trasferta === tua) ? 'tua' : '';
      let score = 'Da giocare';
      if (p.played && p.playedRitorno) {
        const totCasa = (p.golCasaAndata || 0) + (p.golCasaRitorno || 0);
        const totTrasferta = (p.golTrasfertaAndata || 0) + (p.golTrasfertaRitorno || 0);
        score = `${p.golCasaAndata}-${p.golTrasfertaAndata} / ${p.golCasaRitorno}-${p.golTrasfertaRitorno}`;
      } else if (p.played) {
        score = `${p.golCasaAndata}-${p.golTrasfertaAndata} (andata)`;
      }
      html += `<div class="match-row ${isTua}">
        <span>${SQUADRE[p.casa].nome}</span>
        <span class="score">${score}</span>
        <span>${SQUADRE[p.trasferta].nome}</span>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderFine(content) {
  const finale = torneo.tabellone.finale[0];
  const vincitore = finale.vincitore;
  const tua = torneo.squadraScelta;
  const msg = vincitore === tua ? '🏆 HAI VINTO GLI EUROPEI 2028!' : `🏆 Campione: ${SQUADRE[vincitore].nome}`;
  content.innerHTML = `
    <div class="fase-titolo">🏆 Fine Torneo</div>
    <div class="turno-box" style="text-align:center">
      <h2 style="color:#ffd700;font-size:22px;margin:12px 0">${msg}</h2>
      <button class="btn primario" onclick="resetTorneo()" style="margin-top:16px">NUOVO TORNEO</button>
    </div>`;
}

/* Simula tutto fino alla prossima partita della tua squadra */
function simulaAvanti() {
  simulaAltrePartite();
  controllaFineFase();
  salvaStato();
  render();
}

/* =========================================================
   AVVIO
   ========================================================= */
// Controlla se c'è un risultato da ricevere
if (!riceviRisultato()) {
  // Nessun risultato: carica stato o mostra scelta
  if (!caricaStato()) {
    torneo = {
      squadraScelta: null,
      fase: 'scelta',
      gironi: {}, partite: [], classifica: {}, qualificate: [], spareggi: [],
      tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
      prossimaPartita: null
    };
  }
}
// Simula le partite in corso
if (torneo.fase !== 'scelta' && torneo.fase !== 'fine') {
  simulaAltrePartite();
  controllaFineFase();
}
render();
</script>
