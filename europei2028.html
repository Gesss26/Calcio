<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Europei 2028 - Qualificazioni</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a15;
    color: #eee;
    overflow: hidden;
    user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .header {
    background: linear-gradient(135deg, #16213e, #0f3460);
    padding: 16px;
    text-align: center;
    border-bottom: 3px solid #ffd700;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 22px; color: #ffd700; letter-spacing: 2px; }
  .header p { font-size: 12px; color: #aaa; margin-top: 4px; }
  .content { padding: 16px; max-width: 900px; margin: 0 auto; width: 100%; padding-bottom: 40px; }
  .fase-titolo {
    font-size: 16px; color: #ffd700; font-weight: bold;
    margin: 20px 0 10px; padding: 8px 12px;
    background: rgba(255,215,0,0.1); border-left: 4px solid #ffd700;
    border-radius: 4px;
  }
  .gironi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .girone {
    background: #16213e; border: 2px solid #0f3460; border-radius: 10px;
    padding: 10px; overflow: hidden;
  }
  .girone h3 {
    color: #ffd700; font-size: 13px; text-align: center;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,215,0,0.3);
  }
  .classifica { width: 100%; border-collapse: collapse; font-size: 11px; }
  .classifica th {
    color: #ffd700; font-size: 10px; padding: 4px 2px;
    text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .classifica td { padding: 3px 2px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .classifica td:first-child { text-align: left; font-weight: bold; }
  .classifica tr.tua { background: rgba(77,171,247,0.25); }
  .classifica tr.qualificata td:first-child { color: #4ade80; }
  .classifica tr.spareggio td:first-child { color: #fbbf24; }
  .squadre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .squadra-btn {
    background: #0f3460; border: 2px solid #4dabf7; border-radius: 8px;
    padding: 8px; cursor: pointer; text-align: center; color: #fff;
    font-size: 11px; font-weight: bold; transition: all 0.2s;
  }
  .squadra-btn:hover { background: #4dabf7; color: #16213e; }
  .squadra-btn.selezionata { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .squadra-btn .maglia {
    width: 40px; height: 52px; margin: 0 auto 4px;
  }
  .squadra-btn .maglia svg { width: 100%; height: 100%; }
  .btn {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;
    padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold;
    cursor: pointer; margin: 4px;
  }
  .btn:hover { background: #4dabf7; color: #0f3460; }
  .btn.primario { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .btn.primario:hover { background: #fff; }
  .turno-box {
    background: #16213e; border: 2px solid #ffd700; border-radius: 10px;
    padding: 12px; margin: 12px 0;
  }
  .turno-box h3 { color: #ffd700; font-size: 14px; margin-bottom: 8px; }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .match-row.tua { background: rgba(77,171,247,0.2); border-radius: 4px; }
  .match-row .score { color: #ffd700; font-weight: bold; margin: 0 8px; }
  .esito { font-size: 11px; color: #4ade80; margin-left: 8px; }
  .torna-menu {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: #0f3460; border: 2px solid #4dabf7; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
    font-size: 12px;
  }
  .torna-menu:hover { background: #4dabf7; color: #0f3460; }
  .nascosto { display: none !important; }
  .avviso {
    background: rgba(255,215,0,0.15); border: 1px solid #ffd700;
    border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #ffd700;
    margin: 10px 0;
  }
  .loading {
    text-align: center; padding: 40px; color: #ffd700; font-size: 14px;
  }
  .loading .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid rgba(255,215,0,0.3); border-top-color: #ffd700;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<button class="torna-menu" onclick="location.href='index.html'">← Menù</button>
<div class="app">
  <div class="header">
    <h1>🏆 EUROPEI 2028</h1>
    <p>Qualificazioni · Spareggi · Fase Finale</p>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Caricamento...</div>
    </div>
  </div>
</div>

<script src="divise.js"></script>
<script>
/* =========================================================
   GIOCATORE SVG (chibi) - riutilizzabile
   ========================================================= */
function creaGiocatoreSVG(divisa, animazione = 'fermo') {
  const capelli = divisa.capelli;
  const pelle = divisa.pelle;
  const maglia = divisa.maglia;
  const pant = divisa.pantaloncini;
  const calze = divisa.calzettoni;
  return `
    <svg viewBox="0 0 100 130" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="50" cy="124" rx="22" ry="4" fill="rgba(0,0,0,0.35)"/>
      <rect x="36" y="85" width="11" height="25" rx="4" fill="${pelle}"/>
      <rect x="53" y="85" width="11" height="25" rx="4" fill="${pelle}"/>
      <rect x="36" y="98" width="11" height="16" rx="2" fill="${calze}"/>
      <rect x="53" y="98" width="11" height="16" rx="2" fill="${calze}"/>
      <rect x="34" y="114" width="14" height="8" rx="3" fill="#1a1a1a"/>
      <rect x="52" y="114" width="14" height="8" rx="3" fill="#1a1a1a"/>
      <rect x="35" y="72" width="30" height="18" rx="4" fill="${pant}"/>
      <rect x="32" y="42" width="36" height="32" rx="6" fill="${maglia}"/>
      <rect x="24" y="44" width="10" height="18" rx="4" fill="${maglia}"/>
      <rect x="66" y="44" width="10" height="18" rx="4" fill="${maglia}"/>
      <rect x="22" y="58" width="10" height="18" rx="4" fill="${pelle}"/>
      <rect x="68" y="58" width="10" height="18" rx="4" fill="${pelle}"/>
      <circle cx="27" cy="78" r="5" fill="${pelle}"/>
      <circle cx="73" cy="78" r="5" fill="${pelle}"/>
      <rect x="46" y="38" width="8" height="6" fill="${pelle}"/>
      <ellipse cx="50" cy="26" rx="20" ry="19" fill="${pelle}"/>
      <path d="M 30 22 Q 32 8 50 6 Q 68 8 70 22 Q 68 16 60 14 Q 55 20 50 18 Q 44 20 40 14 Q 32 16 30 22 Z" fill="${capelli}"/>
      <path d="M 30 22 Q 28 28 32 30 Q 34 26 34 22 Z" fill="${capelli}"/>
      <path d="M 70 22 Q 72 28 68 30 Q 66 26 66 22 Z" fill="${capelli}"/>
      <ellipse cx="43" cy="27" rx="3" ry="4" fill="#1a1a1a"/>
      <ellipse cx="57" cy="27" rx="3" ry="4" fill="#1a1a1a"/>
      <circle cx="44" cy="25.5" r="1" fill="#fff"/>
      <circle cx="58" cy="25.5" r="1" fill="#fff"/>
      <circle cx="38" cy="33" r="2.5" fill="rgba(255,120,120,0.5)"/>
      <circle cx="62" cy="33" r="2.5" fill="rgba(255,120,120,0.5)"/>
      <path d="M 45 35 Q 50 38 55 35" stroke="#8B2020" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <text x="50" y="62" font-size="10" font-weight="bold" fill="rgba(0,0,0,0.35)" text-anchor="middle" font-family="Arial">10</text>
    </svg>
  `;
}

/* =========================================================
   STATO
   ========================================================= */
let stato = {
  squadraScelta: null,
  fase: 'scelta',
  gironi: {},
  gironiRaw: {},
  qualificate: [],
  spareggi: [],
  tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] }
};

/* =========================================================
   LOGICA TORNEO
   ========================================================= */
const GRUPPI = ['A','B','C','D','E','F','G','H'];

function creaGironi() {
  const ids = Object.keys(SQUADRE);
  const mescolate = [...ids].sort(() => Math.random() - 0.5);
  const gironi = {};
  const perGirone = Math.ceil(ids.length / 8);
  GRUPPI.forEach((g, i) => {
    gironi[g] = mescolate.slice(i * perGirone, (i + 1) * perGirone);
  });
  return gironi;
}

function simulaPartita(a, b) {
  const forza = {
    italia: 90, francia: 92, germania: 88, spagna: 91, portogallo: 87,
    inghilterra: 89, olanda: 85, belgio: 84, croazia: 83, danimarca: 82,
    svizzera: 80, austria: 79, polonia: 78, ucraina: 77, turchia: 76,
    svezia: 75, norvegia: 74, scozia: 73, galles: 72, irlanda: 71,
    serbia: 70, ungheria: 69, romania: 68, grecia: 67, cechia: 66,
    slovacchia: 65, slovenia: 64, finlandia: 63, islanda: 62, albania: 61,
    bosnia: 60, macedonia: 59, montenegro: 58, bulgaria: 57, bielorussia: 56,
    georgia: 55, armenia: 54, azerbaigian: 53, kazakistan: 52, cipro: 51,
    malta: 50, lussemburgo: 49, estonia: 48, lettonia: 47, lituania: 46,
    moldavia: 45, kosovo: 44, faroe: 43, andorra: 42, sanmarino: 41,
    gibilterra: 40, liechtenstein: 39, russia: 80
  };
  const fa = forza[a] || 50, fb = forza[b] || 50;
  const pa = fa / (fa + fb);
  const golA = Math.random() < pa ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  const golB = Math.random() < (1 - pa) ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  return { golA, golB };
}

function simulaGirone(girone, squadre) {
  const classifica = {};
  squadre.forEach(s => classifica[s] = { punti: 0, gf: 0, gs: 0, dr: 0, giocate: 0 });
  const partite = [];
  for (let i = 0; i < squadre.length; i++) {
    for (let j = i + 1; j < squadre.length; j++) {
      const r1 = simulaPartita(squadre[i], squadre[j]);
      partite.push({ casa: squadre[i], trasferta: squadre[j], golCasa: r1.golA, golTrasferta: r1.golB });
      classifica[squadre[i]].gf += r1.golA; classifica[squadre[i]].gs += r1.golB;
      classifica[squadre[j]].gf += r1.golB; classifica[squadre[j]].gs += r1.golA;
      classifica[squadre[i]].giocate++; classifica[squadre[j]].giocate++;
      if (r1.golA > r1.golB) classifica[squadre[i]].punti += 3;
      else if (r1.golA < r1.golB) classifica[squadre[j]].punti += 3;
      else { classifica[squadre[i]].punti += 1; classifica[squadre[j]].punti += 1; }
      const r2 = simulaPartita(squadre[j], squadre[i]);
      partite.push({ casa: squadre[j], trasferta: squadre[i], golCasa: r2.golA, golTrasferta: r2.golB });
      classifica[squadre[j]].gf += r2.golA; classifica[squadre[j]].gs += r2.golB;
      classifica[squadre[i]].gf += r2.golB; classifica[squadre[i]].gs += r2.golA;
      classifica[squadre[j]].giocate++; classifica[squadre[i]].giocate++;
      if (r2.golA > r2.golB) classifica[squadre[j]].punti += 3;
      else if (r2.golA < r2.golB) classifica[squadre[i]].punti += 3;
      else { classifica[squadre[j]].punti += 1; classifica[squadre[i]].punti += 1; }
    }
  }
  const ordinata = Object.entries(classifica)
    .map(([s, d]) => ({ squadra: s, ...d, dr: d.gf - d.gs }))
    .sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
  return { classifica: ordinata, partite };
}

function eseguiQualificazioni() {
  stato.gironi = {};
  for (const g of GRUPPI) {
    const squadre = stato.gironiRaw[g];
    stato.gironi[g] = simulaGirone(g, squadre);
  }
  stato.qualificate = [];
  for (const g of GRUPPI) {
    const top2 = stato.gironi[g].classifica.slice(0, 2);
    top2.forEach(t => stato.qualificate.push(t.squadra));
  }
  const spareggianti = [];
  for (const g of GRUPPI) {
    const c = stato.gironi[g].classifica;
    if (c[2]) spareggianti.push(c[2].squadra);
    if (c[3]) spareggianti.push(c[3].squadra);
  }
  const mescolati = spareggianti.sort(() => Math.random() - 0.5);
  stato.spareggi = [];
  for (let i = 0; i < 8; i++) {
    const a = mescolati[i * 2], b = mescolati[i * 2 + 1];
    if (!a || !b) continue;
    const r = simulaPartita(a, b);
    const vincitore = r.golA >= r.golB ? a : b;
    stato.spareggi.push({ a, b, golA: r.golA, golB: r.golB, vincitore });
  }
  stato.qualificate = stato.qualificate.concat(stato.spareggi.map(s => s.vincitore));
  stato.fase = 'qualificazioni';
  render();
}

function simulaTurno(turno) {
  const partite = stato.tabellone[turno];
  partite.forEach(p => {
    if (!p.vincitore) {
      const r = simulaPartita(p.a, p.b);
      p.golA = r.golA; p.golB = r.golB;
      if (r.golA === r.golB) {
        const rigA = Math.floor(Math.random() * 5) + 1;
        const rigB = Math.floor(Math.random() * 5) + 1;
        p.rigA = rigA; p.rigB = rigB;
        p.vincitore = rigA >= rigB ? p.a : p.b;
      } else {
        p.vincitore = r.golA > r.golB ? p.a : p.b;
      }
    }
  });
}

function creaTabellone(qualificate) {
  const q = qualificate.slice(0, 16);
  const mescolate = [...q].sort(() => Math.random() - 0.5);
  const ottavi = [];
  for (let i = 0; i < 8; i++) {
    ottavi.push({ a: mescolate[i * 2], b: mescolate[i * 2 + 1] });
  }
  stato.tabellone.ottavi = ottavi;
  stato.fase = 'ottavi';
  render();
}

function avanzaTurno() {
  if (stato.fase === 'ottavi') {
    simulaTurno('ottavi');
    const vincitori = stato.tabellone.ottavi.map(p => p.vincitore);
    const quarti = [];
    for (let i = 0; i < 4; i++) quarti.push({ a: vincitori[i * 2], b: vincitori[i * 2 + 1] });
    stato.tabellone.quarti = quarti;
    stato.fase = 'quarti';
    render();
  } else if (stato.fase === 'quarti') {
    simulaTurno('quarti');
    const vincitori = stato.tabellone.quarti.map(p => p.vincitore);
    const semi = [];
    for (let i = 0; i < 2; i++) semi.push({ a: vincitori[i * 2], b: vincitori[i * 2 + 1] });
    stato.tabellone.semifinali = semi;
    stato.fase = 'semifinali';
    render();
  } else if (stato.fase === 'semifinali') {
    simulaTurno('semifinali');
    const vincitori = stato.tabellone.semifinali.map(p => p.vincitore);
    stato.tabellone.finale = [{ a: vincitori[0], b: vincitori[1] }];
    stato.fase = 'finale';
    render();
  } else if (stato.fase === 'finale') {
    simulaTurno('finale');
    stato.fase = 'fine';
    render();
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const content = document.getElementById('content');
  if (stato.fase === 'scelta') {
    renderScelta(content);
  } else if (stato.fase === 'qualificazioni') {
    renderQualificazioni(content);
  } else if (['ottavi','quarti','semifinali','finale'].includes(stato.fase)) {
    renderTabellone(content);
  } else if (stato.fase === 'fine') {
    renderFine(content);
  }
}

function renderScelta(content) {
  let html = `<div class="fase-titolo">Scegli la tua squadra</div>
    <div class="avviso">Seleziona una nazionale per iniziare le qualificazioni agli Europei 2028.</div>
    <div class="squadre-grid">`;
  Object.keys(SQUADRE).forEach(id => {
    html += `<div class="squadra-btn ${id === stato.squadraScelta ? 'selezionata' : ''}" onclick="selezionaSquadra('${id}')">
      <div class="maglia">${creaGiocatoreSVG(SQUADRE[id].casa, 'fermo')}</div>
      <div>${SQUADRE[id].nome}</div>
    </div>`;
  });
  html += `</div>`;
  if (stato.squadraScelta) {
    html += `<div style="text-align:center;margin-top:16px">
      <button class="btn primario" onclick="iniziaQualificazioni()">INIZIA QUALIFICAZIONI</button>
    </div>`;
  }
  content.innerHTML = html;
}

function selezionaSquadra(id) {
  stato.squadraScelta = id;
  render();
}

function iniziaQualificazioni() {
  stato.gironiRaw = creaGironi();
  eseguiQualificazioni();
}

function renderQualificazioni(content) {
  let html = `<div class="fase-titolo">📋 Fase a Gironi — Qualificazioni</div>`;
  html += `<div class="avviso">La tua squadra: <strong>${SQUADRE[stato.squadraScelta].nome}</strong></div>`;
  html += `<div class="gironi-grid">`;
  for (const g of GRUPPI) {
    const girone = stato.gironi[g];
    if (!girone) continue;
    html += `<div class="girone"><h3>Girone ${g}</h3><table class="classifica">
      <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
    girone.classifica.forEach((t, idx) => {
      const cls = t.squadra === stato.squadraScelta ? 'tua' : '';
      const qual = idx < 2 ? 'qualificata' : idx < 4 ? 'spareggio' : '';
      html += `<tr class="${cls} ${qual}">
        <td>${SQUADRE[t.squadra].nome}</td>
        <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  html += `<div class="fase-titolo">⚔️ Spareggi</div><div class="turno-box">`;
  stato.spareggi.forEach(p => {
    const cls = (p.a === stato.squadraScelta || p.b === stato.squadraScelta) ? 'tua' : '';
    html += `<div class="match-row ${cls}">
      <span>${SQUADRE[p.a].nome}</span>
      <span class="score">${p.golA} - ${p.golB}</span>
      <span>${SQUADRE[p.b].nome}</span>
      <span class="esito">→ ${SQUADRE[p.vincitore].nome}</span>
    </div>`;
  });
  html += `</div>`;
  html += `<div style="text-align:center;margin-top:16px">
    <button class="btn primario" onclick="vaiAgliOttavi()">VAI AGLI OTTAVI</button>
  </div>`;
  content.innerHTML = html;
}

function vaiAgliOttavi() {
  creaTabellone(stato.qualificate);
}

function renderTabellone(content) {
  const turni = [
    { key: 'ottavi', nome: 'Ottavi di Finale' },
    { key: 'quarti', nome: 'Quarti di Finale' },
    { key: 'semifinali', nome: 'Semifinali' },
    { key: 'finale', nome: 'Finale' }
  ];
  let html = `<div class="fase-titolo">🏆 Fase Finale — Europei 2028</div>`;
  html += `<div class="avviso">La tua squadra: <strong>${SQUADRE[stato.squadraScelta].nome}</strong></div>`;
  turni.forEach(t => {
    const partite = stato.tabellone[t.key];
    if (!partite || partite.length === 0) return;
    const completato = partite.every(p => p.vincitore);
    html += `<div class="turno-box"><h3>${t.nome} ${completato ? '✅' : ''}</h3>`;
    partite.forEach(p => {
      const cls = (p.a === stato.squadraScelta || p.b === stato.squadraScelta) ? 'tua' : '';
      let score = '-';
      if (p.golA !== undefined) score = `${p.golA} - ${p.golB}`;
      if (p.rigA !== undefined) score += ` (${p.rigA}-${p.rigB} dcr)`;
      let esito = '';
      if (p.vincitore) {
        esito = `→ ${SQUADRE[p.vincitore].nome}`;
        if (p.vincitore !== stato.squadraScelta && (p.a === stato.squadraScelta || p.b === stato.squadraScelta)) {
          esito += ' ❌';
        }
      }
      html += `<div class="match-row ${cls}">
        <span>${SQUADRE[p.a].nome}</span>
        <span class="score">${score}</span>
        <span>${SQUADRE[p.b].nome}</span>
        <span class="esito">${esito}</span>
      </div>`;
    });
    html += `</div>`;
  });
  const turnoCorrente = ['ottavi','quarti','semifinali','finale'].find(t => {
    const p = stato.tabellone[t];
    return p && p.length > 0 && !p.every(x => x.vincitore);
  });
  if (turnoCorrente) {
    const nomeTurno = { ottavi:'Ottavi', quarti:'Quarti', semifinali:'Semifinali', finale:'Finale' }[turnoCorrente];
    html += `<div style="text-align:center;margin:16px">
      <button class="btn primario" onclick="avanzaTurno()">SIMULA ${nomeTurno.toUpperCase()}</button>
    </div>`;
  }
  content.innerHTML = html;
}

function renderFine(content) {
  const finale = stato.tabellone.finale[0];
  const campione = finale.vincitore;
  const tua = stato.squadraScelta;
  let msg = campione === tua ? '🏆 HAI VINTO GLI EUROPEI 2028!' : `🏆 Campione: ${SQUADRE[campione].nome}`;
  let html = `<div class="fase-titolo">🏆 Fine Torneo</div>
    <div class="turno-box" style="text-align:center">
      <h2 style="color:#ffd700;font-size:22px;margin:12px 0">${msg}</h2>
      <p style="font-size:14px;color:#aaa;margin:8px 0">Finale: ${SQUADRE[finale.a].nome} ${finale.golA} - ${finale.golB} ${SQUADRE[finale.b].nome}</p>
      ${finale.rigA !== undefined ? `<p style="font-size:12px;color:#aaa">Rigori: ${finale.rigA} - ${finale.rigB}</p>` : ''}
      <button class="btn primario" onclick="location.reload()" style="margin-top:16px">NUOVO TORNEO</button>
    </div>`;
  content.innerHTML = html;
}

/* =========================================================
   AVVIO
   ========================================================= */
render();
</script>
</body>
</html>
