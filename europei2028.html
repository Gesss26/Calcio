<body>
<button class="torna-menu" onclick="location.href='index.html'">← Menù</button>
<button class="reset-btn" onclick="resetTorneo()">🗑 Reset</button>
<div class="app">
  <div class="header">
    <h1>🏆 EUROPEI 2028</h1>
    <p>Qualificazioni · Spareggi · Fase Finale</p>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Caricamento...</div>
    </div>

<script src="divise.js"></script>
<script>
/* =========================================================
   COSTANTI
   ========================================================= */
const STORAGE_KEY = 'europei2028_stato';
const GRUPPI_NOMI = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const OSPITANTI = ['inghilterra', 'irlanda', 'scozia', 'galles'];

/* =========================================================
   STATO TORNEO
   ========================================================= */
let torneo = {
  squadraScelta: null,
  fase: 'scelta', // scelta | qualificazioni | spareggi | gironi_finali | ottavi | quarti | semifinali | finale | fine
  gironi: {},
  partite: [],
  classifica: {},
  qualificateDirette: [],  // 12 vincitrici + 8 migliori seconde = 20
  postiOspitanti: [],       // 0-2 ospitanti qualificate d'ufficio
  spareggi: [],             // percorsi spareggi
  scenario: null,           // 'due-ospiti' | 'un-ospite' | 'zero-ospiti'
  gironiFinali: {},         // 6 gironi da 4 della fase finale
  classificaGironiFinali: {},
  tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
  prossimaPartita: null
};

/* =========================================================
   PERSISTENZA
   ========================================================= */
function caricaStato() {
  const salvato = localStorage.getItem(STORAGE_KEY);
  if (salvato) {
    try { torneo = JSON.parse(salvato); return true; } catch (e) { return false; }
  }
  return false;
}
function salvaStato() { localStorage.setItem(STORAGE_KEY, JSON.stringify(torneo)); }
function resetTorneo() {
  if (confirm('Sei sicuro di voler resettare il torneo? Perderai tutti i progressi.')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

/* =========================================================
   CREAZIONE TORNEO
   ========================================================= */
function creaGironi() {
  const ids = Object.keys(SQUADRE);
  const ospitanti = ids.filter(id => OSPITANTI.includes(id));
  const nonOspitanti = ids.filter(id => !OSPITANTI.includes(id));

  // Mescola
  const mescolateOsp = [...ospitanti].sort(() => Math.random() - 0.5);
  const mescolateNon = [...nonOspitanti].sort(() => Math.random() - 0.5);

  // Distribuisci le 4 ospitanti in 4 gironi diversi (A, B, C, D)
  // Poi riempi gli altri 8 gironi (E..L) con le non ospitanti
  // 6 gironi da 5 + 6 gironi da 4 = 30 + 24 = 54
  // Assegnamo 5 squadre ai gironi A,B,C,D (con 1 ospitante ciascuno) → 4*5=20
  // Assegnamo 4 squadre ai gironi E,F,G,H,I,J,K,L → 8*4=32
  // Totale 20+32 = 52... ne mancano 2!
  // Meglio: 6 gironi da 5 + 6 gironi da 4 = 30 + 24 = 54 ✅
  // I 4 ospitanti vanno nei primi 4 gironi (A,B,C,D) che saranno da 5 squadre
  // Quindi:
  // - A, B, C, D: 5 squadre ciascuno (4 ospitanti + 1 non) → ma 4 ospitanti totali
  //   A → inghilterra + 4 non
  //   B → irlanda + 4 non
  //   C → scozia + 4 non
  //   D → galles + 4 non
  //   = 4 ospitanti + 16 non = 20
  // - E, F: 5 squadre (5 non ciascuno) = 10
  // - G, H, I, J, K, L: 4 squadre (4 non ciascuno) = 24
  // Totale: 20 + 10 + 24 = 54 ✅

  const gironi = {};
  let idxNon = 0;

  // A, B, C, D: 1 ospitante + 4 non
  ['A','B','C','D'].forEach((nome, i) => {
    gironi[nome] = [mescolateOsp[i]];
    for (let k = 0; k < 4; k++) {
      gironi[nome].push(mescolateNon[idxNon++]);
    }
  });

  // E, F: 5 non
  ['E','F'].forEach(nome => {
    gironi[nome] = [];
    for (let k = 0; k < 5; k++) gironi[nome].push(mescolateNon[idxNon++]);
  });

  // G, H, I, J, K, L: 4 non
  ['G','H','I','J','K','L'].forEach(nome => {
    gironi[nome] = [];
    for (let k = 0; k < 4; k++) gironi[nome].push(mescolateNon[idxNon++]);
  });

  return gironi;
}

function creaPartiteGirone(gironi) {
  const partite = [];
  let idPartita = 0;
  for (const nome of GRUPPI_NOMI) {
    const squadre = gironi[nome];
    for (let i = 0; i < squadre.length; i++) {
      for (let j = i + 1; j < squadre.length; j++) {
        const casaAndata = Math.random() < 0.5 ? squadre[i] : squadre[j];
        const trasfertaAndata = casaAndata === squadre[i] ? squadre[j] : squadre[i];
        partite.push({
          id: 'gir_' + nome + '_' + (idPartita++),
          girone: nome,
          andata: { casa: casaAndata, trasferta: trasfertaAndata, golCasa: null, golTrasferta: null, played: false },
          ritorno: { casa: trasfertaAndata, trasferta: casaAndata, golCasa: null, golTrasferta: null, played: false }
        });
      }
    }
  }
  return partite;
}

function inizializzaTorneo(squadraScelta) {
  torneo = {
    squadraScelta: squadraScelta,
    fase: 'qualificazioni',
    gironi: {},
    partite: [],
    classifica: {},
    qualificateDirette: [],
    postiOspitanti: [],
    spareggi: [],
    scenario: null,
    gironiFinali: {},
    classificaGironiFinali: {},
    tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
    prossimaPartita: null
  };
  torneo.gironi = creaGironi();
  torneo.partite = creaPartiteGirone(torneo.gironi);
  for (const nome of GRUPPI_NOMI) {
    torneo.classifica[nome] = torneo.gironi[nome].map(sq => ({
      squadra: sq, punti: 0, giocate: 0, vinte: 0, pareggi: 0, perse: 0, gf: 0, gs: 0, dr: 0
    }));
  }
  calcolaProssimaPartita();
  salvaStato();
  render();
}

/* =========================================================
   TROVA PROSSIMA PARTITA
   ========================================================= */
function calcolaProssimaPartita() {
  const tua = torneo.squadraScelta;
  if (!tua) { torneo.prossimaPartita = null; return; }

  if (torneo.fase === 'qualificazioni') {
    for (const p of torneo.partite) {
      if (!p.andata.played && (p.andata.casa === tua || p.andata.trasferta === tua)) {
        torneo.prossimaPartita = { tipo: 'girone', id: p.id, sotto: 'andata', casa: p.andata.casa, trasferta: p.andata.trasferta, girone: p.girone };
        return;
      }
      if (!p.ritorno.played && (p.ritorno.casa === tua || p.ritorno.trasferta === tua)) {
        torneo.prossimaPartita = { tipo: 'girone', id: p.id, sotto: 'ritorno', casa: p.ritorno.casa, trasferta: p.ritorno.trasferta, girone: p.girone };
        return;
      }
    }
    torneo.prossimaPartita = null;
  } else if (torneo.fase === 'spareggi') {
    for (const percorso of torneo.spareggi) {
      for (const p of percorso.partite) {
        if ((p.casa === tua || p.trasferta === tua) && !p.played) {
          torneo.prossimaPartita = { tipo: 'spareggio', id: p.id, sotto: 'unica', casa: p.casa, trasferta: p.trasferta };
          return;
        }
      }
    }
    torneo.prossimaPartita = null;
  } else if (torneo.fase === 'gironi_finali') {
    // Cerca partita nel girone finale
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const g = torneo.gironiFinali[nome];
      for (const p of g.partite) {
        if ((p.casa === tua || p.trasferta === tua) && !p.played) {
          torneo.prossimaPartita = { tipo: 'girone_finale', id: p.id, sotto: 'unica', casa: p.casa, trasferta: p.trasferta, girone: nome };
          return;
        }
      }
    }
    torneo.prossimaPartita = null;
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase];
    if (!turno) { torneo.prossimaPartita = null; return; }
    for (const p of turno) {
      if ((p.casa === tua || p.trasferta === tua) && !p.played) {
        torneo.prossimaPartita = { tipo: torneo.fase, id: p.id, sotto: 'unica', casa: p.casa, trasferta: p.trasferta };
        return;
      }
    }
    torneo.prossimaPartita = null;
  }
}

/* =========================================================
   SIMULAZIONE PARTITA
   ========================================================= */
function forzaSquadra(id) {
  const forza = {
    italia: 90, francia: 92, germania: 88, spagna: 91, portogallo: 87,
    inghilterra: 89, olanda: 85, belgio: 84, croazia: 83, danimarca: 82,
    svizzera: 80, austria: 79, polonia: 78, ucraina: 77, turchia: 76,
    svezia: 75, norvegia: 74, scozia: 73, galles: 72, irlanda: 71,
    serbia: 70, ungheria: 69, romania: 68, grecia: 67, cechia: 66,
    slovacchia: 65, slovenia: 64, finlandia: 63, islanda: 62, albania: 61,
    bosnia: 60, macedonia: 59, montenegro: 58, bulgaria: 57, bielorussia: 56,
    georgia: 55, armenia: 54, azerbaigian: 53, kazakistan: 52, cipro: 51,
    malta: 50, lussemburgo: 49, estonia: 48, lettonia: 47, lituania: 46,
    moldavia: 45, kosovo: 44, faroe: 43, andorra: 42, sanmarino: 41,
    gibilterra: 40, liechtenstein: 39, russia: 80
  };
  return forza[id] || 50;
}

function simulaPartita(a, b, casaA = true) {
  const fa = forzaSquadra(a) + (casaA ? 5 : 0);
  const fb = forzaSquadra(b) + (casaA ? 0 : 5);
  const pa = fa / (fa + fb);
  const golA = Math.random() < pa ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  const golB = Math.random() < (1 - pa) ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  return { golA, golB };
}

/* =========================================================
   CLASSIFICA GIRONI QUALIFICAZIONE
   ========================================================= */
function aggiornaClassifica(girone, casa, trasferta, golCasa, golTrasferta) {
  const cls = torneo.classifica[girone];
  const c = cls.find(x => x.squadra === casa);
  const t = cls.find(x => x.squadra === trasferta);
  c.giocate++; t.giocate++;
  c.gf += golCasa; c.gs += golTrasferta;
  t.gf += golTrasferta; t.gs += golCasa;
  if (golCasa > golTrasferta) { c.punti += 3; c.vinte++; t.perse++; }
  else if (golCasa < golTrasferta) { t.punti += 3; t.vinte++; c.perse++; }
  else { c.punti += 1; t.punti += 1; c.pareggi++; t.pareggi++; }
  c.dr = c.gf - c.gs;
  t.dr = t.gf - t.gs;
  cls.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

/* =========================================================
   GIOCA PARTITA → index.html
   ========================================================= */
function giocaPartita(tipo, idPartita, sotto, casa, trasferta) {
  const datiPartita = {
    sqTU: casa === torneo.squadraScelta ? casa : trasferta,
    sqCPU: casa === torneo.squadraScelta ? trasferta : casa,
    tipo: tipo,
    idPartita: idPartita,
    sotto: sotto,
    casaOriginale: casa,
    trasfertaOriginale: trasferta
  };
  const chiave = idPartita + '_' + sotto;
  localStorage.setItem('torneo_partita_attiva_' + chiave, JSON.stringify(datiPartita));
  location.href = 'index.html?torneo=europei&partita=' + encodeURIComponent(chiave);
}

/* =========================================================
   RICEZIONE RISULTATO DA index.html
   ========================================================= */
function riceviRisultato() {
  const urlParams = new URLSearchParams(window.location.search);
  const risultatoId = urlParams.get('risultato');
  if (!risultatoId) return false;

  const key = 'torneo_partita_' + risultatoId;
  const risultatoJson = localStorage.getItem(key);
  if (!risultatoJson) return false;

  const risultato = JSON.parse(risultatoJson);
  localStorage.removeItem(key);

  const datiAttivi = JSON.parse(localStorage.getItem('torneo_partita_attiva_' + risultatoId) || '{}');
  if (!datiAttivi.casaOriginale) return false;

  const sqTU = datiAttivi.sqTU;
  const golTU = risultato.golTU;
  const golCPU = risultato.golCPU;
  const casa = datiAttivi.casaOriginale;
  const trasferta = datiAttivi.trasfertaOriginale;
  const golCasa = casa === sqTU ? golTU : golCPU;
  const golTrasferta = casa === sqTU ? golCPU : golTU;

  // Parsing id
  const parti = risultatoId.split('_');
  if (parti[0] === 'gir') {
    // gir_A_0_andata
    const girone = parti[1];
    const idPartita = 'gir_' + parti[1] + '_' + parti[2];
    const sotto = parti[3];
    const partita = torneo.partite.find(p => p.id === idPartita);
    if (!partita) return false;
    partita[sotto].golCasa = golCasa;
    partita[sotto].golTrasferta = golTrasferta;
    partita[sotto].played = true;
    aggiornaClassifica(girone, casa, trasferta, golCasa, golTrasferta);
  } else if (parti[0] === 'spareggio') {
    // spareggio_p0_0
    const percorsoId = parti[1];
    const partitaId = parti[2];
    const percorso = torneo.spareggi.find(x => x.id === percorsoId);
    if (!percorso) return false;
    const p = percorso.partite.find(x => x.id === 'spareggio_' + percorsoId + '_' + partitaId);
    if (!p) return false;
    p.golCasa = golCasa;
    p.golTrasferta = golTrasferta;
    p.played = true;
    p.vincitore = golCasa > golTrasferta ? casa : (golTrasferta > golCasa ? trasferta : (Math.random() < 0.5 ? casa : trasferta));
  } else if (parti[0] === 'girone_finale' || parti[0] === 'gf') {
    // gf_A_0
    const nome = parti[1];
    const idPartita = 'gf_' + parti[1] + '_' + parti[2];
    const g = torneo.gironiFinali[nome];
    if (!g) return false;
    const p = g.partite.find(x => x.id === idPartita);
    if (!p) return false;
    p.golCasa = golCasa;
    p.golTrasferta = golTrasferta;
    p.played = true;
    aggiornaClassificaGironeFinale(nome, casa, trasferta, golCasa, golTrasferta);
  } else {
    // ottavi_0, quarti_0, semifinali_0, finale_0
    const turno = parti[0];
    const index = parseInt(parti[1]);
    const p = torneo.tabellone[turno]?.[index];
    if (!p) return false;
    p.golCasa = golCasa;
    p.golTrasferta = golTrasferta;
    p.played = true;
    p.vincitore = golCasa > golTrasferta ? casa : (golTrasferta > golCasa ? trasferta : (Math.random() < 0.5 ? casa : trasferta));
  }

  window.history.replaceState({}, document.title, 'europei2028.html');
  salvaStato();
  return true;
}

function aggiornaClassificaGironeFinale(nome, casa, trasferta, golCasa, golTrasferta) {
  const cls = torneo.classificaGironiFinali[nome];
  const c = cls.find(x => x.squadra === casa);
  const t = cls.find(x => x.squadra === trasferta);
  if (!c || !t) return;
  c.giocate++; t.giocate++;
  c.gf += golCasa; c.gs += golTrasferta;
  t.gf += golTrasferta; t.gs += golCasa;
  if (golCasa > golTrasferta) { c.punti += 3; c.vinte++; t.perse++; }
  else if (golCasa < golTrasferta) { t.punti += 3; t.vinte++; c.perse++; }
  else { c.punti += 1; t.punti += 1; c.pareggi++; t.pareggi++; }
  c.dr = c.gf - c.gs;
  t.dr = t.gf - t.gs;
  cls.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

/* =========================================================
   SIMULAZIONE ALTRE PARTITE
   ========================================================= */
function simulaAltrePartite() {
  const tua = torneo.squadraScelta;
  if (torneo.fase === 'qualificazioni') {
    for (const p of torneo.partite) {
      if (!p.andata.played && p.andata.casa !== tua && p.andata.trasferta !== tua) {
        const r = simulaPartita(p.andata.casa, p.andata.trasferta, true);
        p.andata.golCasa = r.golA;
        p.andata.golTrasferta = r.golB;
        p.andata.played = true;
        aggiornaClassifica(p.girone, p.andata.casa, p.andata.trasferta, r.golA, r.golB);
      }
      if (!p.ritorno.played && p.ritorno.casa !== tua && p.ritorno.trasferta !== tua) {
        const r = simulaPartita(p.ritorno.casa, p.ritorno.trasferta, true);
        p.ritorno.golCasa = r.golA;
        p.ritorno.golTrasferta = r.golB;
        p.ritorno.played = true;
        aggiornaClassifica(p.girone, p.ritorno.casa, p.ritorno.trasferta, r.golA, r.golB);
      }
    }
  } else if (torneo.fase === 'spareggi') {
    for (const percorso of torneo.spareggi) {
      for (const p of percorso.partite) {
        if (!p.played && p.casa !== tua && p.trasferta !== tua) {
          const r = simulaPartita(p.casa, p.trasferta, true);
          p.golCasa = r.golA;
          p.golTrasferta = r.golB;
          p.played = true;
          p.vincitore = r.golA > r.golB ? p.casa : (r.golB > r.golA ? p.trasferta : (Math.random() < 0.5 ? p.casa : p.trasferta));
        }
      }
    }
  } else if (torneo.fase === 'gironi_finali') {
    for (const nome of Object.keys(torneo.gironiFinali)) {
      for (const p of torneo.gironiFinali[nome].partite) {
        if (!p.played && p.casa !== tua && p.trasferta !== tua) {
          const r = simulaPartita(p.casa, p.trasferta, true);
          p.golCasa = r.golA;
          p.golTrasferta = r.golB;
          p.played = true;
          aggiornaClassificaGironeFinale(nome, p.casa, p.trasferta, r.golA, r.golB);
        }
      }
    }
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase];
    if (!turno) return;
    for (const p of turno) {
      if (!p.played && p.casa !== tua && p.trasferta !== tua) {
        const r = simulaPartita(p.casa, p.trasferta, true);
        p.golCasa = r.golA;
        p.golTrasferta = r.golB;
        p.played = true;
        p.vincitore = r.golA > r.golB ? p.casa : (r.golB > r.golA ? p.trasferta : (Math.random() < 0.5 ? p.casa : p.trasferta));
      }
    }
  }
}

/* =========================================================
   LOGICA QUALIFICAZIONE (fine qualificazioni)
   ========================================================= */
function calcolaQualificazioni() {
  // 12 vincitrici + 8 migliori seconde = 20 qualificate dirette
  const vincitrici = [];
  const seconde = [];
  const terze = [];

  for (const nome of GRUPPI_NOMI) {
    const cls = torneo.classifica[nome];
    if (cls[0]) vincitrici.push({ squadra: cls[0].squadra, punti: cls[0].punti, dr: cls[0].dr, gf: cls[0].gf, girone: nome, pos: 1 });
    if (cls[1]) seconde.push({ squadra: cls[1].squadra, punti: cls[1].punti, dr: cls[1].dr, gf: cls[1].gf, girone: nome, pos: 2 });
    if (cls[2]) terze.push({ squadra: cls[2].squadra, punti: cls[2].punti, dr: cls[2].dr, gf: cls[2].gf, girone: nome, pos: 3 });
  }

  // Ordina le seconde
  seconde.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
  // Ordina le terze
  terze.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);

  // 12 vincitrici
  const qualificateVincitrici = vincitrici.map(v => v.squadra);

  // 8 migliori seconde
  const miglioriSeconde = seconde.slice(0, 8).map(s => s.squadra);
  // Seconde non qualificate (per spareggi)
  const secondeNonQualificate = seconde.slice(8);

  // Terze non qualificate (per spareggi)
  const terzeNonQualificate = terze;

  torneo.qualificateDirette = [...qualificateVincitrici, ...miglioriSeconde];

  // ===== POSTI OSPITANTI =====
  // Le 4 nazioni ospitanti: inghilterra, irlanda, scozia, galles
  // 2 posti riservati alle 2 migliori ospitanti non qualificate direttamente
  const ospitantiNonQualificati = OSPITANTI.filter(o => !torneo.qualificateDirette.includes(o));

  // Calcola "ranking" delle ospitanti non qualificate
  // Usiamo la posizione nei rispettivi gironi + punti + dr
  function rankOspitante(id) {
    for (const nome of GRUPPI_NOMI) {
      const idx = torneo.classifica[nome].findIndex(x => x.squadra === id);
      if (idx >= 0) {
        const t = torneo.classifica[nome][idx];
        return { id, pos: idx + 1, punti: t.punti, dr: t.dr, gf: t.gf };
      }
    }
    return { id, pos: 99, punti: 0, dr: 0, gf: 0 };
  }
  const ospitantiRanked = ospitantiNonQualificati.map(rankOspitante)
    .sort((a, b) => a.pos - b.pos || b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);

  // Prendi le 2 migliori ospitanti
  const postiOspitanti = ospitantiRanked.slice(0, 2).map(o => o.id);
  torneo.postiOspitanti = postiOspitanti;

  // Aggiungi le ospitanti alle qualificate dirette (ora sono 20 + 2 = 22)
  // Ma attenzione: se una ospitante è già qualificata, non conta
  // Se un'ospitante è già nelle 20, e ce ne sono 2 non qualificate, entrambe prendono il posto.
  // Se ce n'è solo 1 non qualificata, prende 1 posto e l'altro va agli spareggi
  // Se 0 ospitanti non qualificate, 0 posti ospitanti e tutti gli spareggi

  // ===== SCENARIO SPAREGGI =====
  // postiOspitanti.length:
  // - 2 → 2 posti ospitanti usati → 8 squadre spareggi in 2 percorsi → 2 posti
  // - 1 → 1 posto ospitante usato → 12 squadre spareggi in 3 percorsi → 3 posti
  // - 0 → 0 posti ospitanti usati → 8 squadre spareggi in 4 percorsi → 4 posti
  torneo.scenario = postiOspitanti.length === 2 ? 'due-ospiti' :
                    postiOspitanti.length === 1 ? 'un-ospite' : 'zero-ospiti';

  // Crea spareggi
  torneo.spareggi = [];

  // Per gli spareggi usiamo: seconde non qualificate + terze
  const disponibiliSpareggi = [...secondeNonQualificate, ...terzeNonQualificate];

  if (torneo.scenario === 'due-ospiti') {
    // 8 squadre → 2 percorsi da 4 (semifinali + finale, gara unica)
    const scelte = disponibiliSpareggi.slice(0, 8);
    torneo.spareggi = creaPercorsiSpareggi(scelte, 2);
  } else if (torneo.scenario === 'un-ospite') {
    // 12 squadre → 3 percorsi da 4 (semifinali + finale, gara unica)
    const scelte = disponibiliSpareggi.slice(0, 12);
    torneo.spareggi = creaPercorsiSpareggi(scelte, 3);
  } else {
    // 8 squadre → 4 spareggi andata/ritorno
    const scelte = disponibiliSpareggi.slice(0, 8);
    torneo.spareggi = creaPercorsiSpareggi(scelte, 4, true);
  }

  // Determina posti spareggi
  torneo.postiSpareggi = torneo.scenario === 'due-ospiti' ? 2 :
                          torneo.scenario === 'un-ospite' ? 3 : 4;

  // Totale qualificate
  torneo.totaleQualificate = torneo.qualificateDirette.length + postiOspitanti.length + torneo.postiSpareggi;
}

function creaPercorsiSpareggi(squadre, numPercorsi, andataRitorno = false) {
  // Mescola
  const mesc = [...squadre].sort(() => Math.random() - 0.5);
  const percorsi = [];
  const perPercorso = mesc.length / numPercorsi;
  for (let i = 0; i < numPercorsi; i++) {
    const gruppo = mesc.slice(i * perPercorso, (i + 1) * perPercorso);
    const partite = [];
    if (andataRitorno) {
      // Spareggio andata/ritorno: 2 squadre per percorso
      // (ma qui abbiamo 8 squadre in 4 percorsi = 2 ciascuno)
      // Quindi ogni percorso ha 1 partita andata/ritorno
      partite.push({
        id: 'spareggio_p' + i + '_0',
        casa: gruppo[0], trasferta: gruppo[1],
        golCasa: null, golTrasferta: null,
        played: false, vincitore: null
      });
    } else {
      // Semifinali + finale in gara unica
      // 4 squadre per percorso: 2 semifinali + 1 finale
      const semi1 = {
        id: 'spareggio_p' + i + '_0',
        casa: gruppo[0], trasferta: gruppo[1],
        golCasa: null, golTrasferta: null,
        played: false, vincitore: null, fase: 'semifinale'
      };
      const semi2 = {
        id: 'spareggio_p' + i + '_1',
        casa: gruppo[2], trasferta: gruppo[3],
        golCasa: null, golTrasferta: null,
        played: false, vincitore: null, fase: 'semifinale'
      };
      partite.push(semi1, semi2);
    }
    percorsi.push({
      id: 'p' + i,
      partite: partite,
      finaleCreata: false
    });
  }
  return percorsi;
}

/* =========================================================
   VERIFICA FINE FASE (chiamata dopo ogni partita)
   ========================================================= */
function controllaFineFase() {
  if (torneo.fase === 'qualificazioni') {
    const tutteGiocate = torneo.partite.every(p => p.andata.played && p.ritorno.played);
    if (tutteGiocate) {
      calcolaQualificazioni();
      torneo.fase = 'spareggi';
      // Crea spareggi (già fatto in calcolaQualificazioni)
      // Trova prossima partita
    }
  } else if (torneo.fase === 'spareggi') {
    // Verifica se tutti gli spareggi sono completati
    let tuttiCompleti = true;
    for (const percorso of torneo.spareggi) {
      // Controlla se tutte le partite sono giocate
      // Se andata/ritorno: 1 partita per percorso, basta played
      // Se semifinali+finale: semifinali giocate → crea finale → finale giocata
      const tutteGiocate = percorso.partite.every(p => p.played);
      if (!tutteGiocate) { tuttiCompleti = false; break; }

      // Se il percorso ha semifinali+finale, devo creare la finale
      if (!percorso.finaleCreata && percorso.partite.length === 2 && percorso.partite.every(p => p.played)) {
        // Crea finale
        const semi1 = percorso.partite[0];
        const semi2 = percorso.partite[1];
        percorso.partite.push({
          id: 'spareggio_' + percorso.id + '_2',
          casa: semi1.vincitore,
          trasferta: semi2.vincitore,
          golCasa: null, golTrasferta: null,
          played: false, vincitore: null, fase: 'finale'
        });
        percorso.finaleCreata = true;
        tuttiCompleti = false;
      }
    }
    if (tuttiCompleti) {
      // Raccogli vincitori spareggi
      const vincitoriSpareggi = [];
      for (const percorso of torneo.spareggi) {
        // L'ultima partita giocata è la finale (o l'unica)
        const ultima = percorso.partite[percorso.partite.length - 1];
        if (ultima.vincitore) vincitoriSpareggi.push(ultima.vincitore);
      }
      // Le qualificate totali sono: qualificateDirette + postiOspitanti + vincitoriSpareggi
      const qualificateFinali = [
        ...torneo.qualificateDirette,
        ...torneo.postiOspitanti,
        ...vincitoriSpareggi
      ];
      // Crea 6 gironi finali da 4 (24 squadre)
      creaGironiFinali(qualificateFinali);
      torneo.fase = 'gironi_finali';
    }
  } else if (torneo.fase === 'gironi_finali') {
    // Verifica se tutti i gironi finali sono completati
    let tuttiCompleti = true;
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const g = torneo.gironiFinali[nome];
      if (!g.partite.every(p => p.played)) { tuttiCompleti = false; break; }
    }
    if (tuttiCompleti) {
      // Calcola qualificate agli ottavi: prime 2 di ogni girone (12) + 4 migliori terze
      const primeDue = [];
      const terze = [];
      for (const nome of Object.keys(torneo.gironiFinali)) {
        const cls = torneo.classificaGironiFinali[nome];
        if (cls[0]) primeDue.push(cls[0].squadra);
        if (cls[1]) primeDue.push(cls[1].squadra);
        if (cls[2]) terze.push(cls[2]);
      }
      terze.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
      const miglioriQuattroTerze = terze.slice(0, 4).map(t => t.squadra);
      const sedici = [...primeDue, ...miglioriQuattroTerze];
      // Sorteggia ottavi
      const mesc = [...sedici].sort(() => Math.random() - 0.5);
      torneo.tabellone.ottavi = [];
      for (let i = 0; i < 8; i++) {
        torneo.tabellone.ottavi.push({
          id: 'ottavi_' + i,
          casa: mesc[i * 2], trasferta: mesc[i * 2 + 1],
          golCasa: null, golTrasferta: null,
          played: false, vincitore: null
        });
      }
      torneo.fase = 'ottavi';
    }
  } else if (['ottavi','quarti','semifinali'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase];
    const tutteGiocate = turno.every(p => p.played);
    if (tutteGiocate) {
      const vincitori = turno.map(p => p.vincitore);
      let prossimoTurno;
      if (torneo.fase === 'ottavi') prossimoTurno = 'quarti';
      else if (torneo.fase === 'quarti') prossimoTurno = 'semifinali';
      else if (torneo.fase === 'semifinali') prossimoTurno = 'finale';
      torneo.tabellone[prossimoTurno] = [];
      const numPartite = vincitori.length / 2;
      for (let i = 0; i < numPartite; i++) {
        torneo.tabellone[prossimoTurno].push({
          id: prossimoTurno + '_' + i,
          casa: vincitori[i * 2],
          trasferta: vincitori[i * 2 + 1],
          golCasa: null, golTrasferta: null,
          played: false, vincitore: null
        });
      }
      torneo.fase = prossimoTurno;
    }
  } else if (torneo.fase === 'finale') {
    const p = torneo.tabellone.finale[0];
    if (p && p.played) {
      torneo.fase = 'fine';
    }
  }
  calcolaProssimaPartita();
  salvaStato();
}

/* =========================================================
   CREAZIONE GIRONI FINALI (24 squadre in 6 gironi da 4)
   ========================================================= */
function creaGironiFinali(qualificate) {
  // Mescola le qualificate
  const mesc = [...qualificate].sort(() => Math.random() - 0.5);
  const nomi = ['A','B','C','D','E','F'];
  torneo.gironiFinali = {};
  torneo.classificaGironiFinali = {};
  for (let i = 0; i < 6; i++) {
    const nome = nomi[i];
    const squadre = mesc.slice(i * 4, (i + 1) * 4);
    torneo.gironiFinali[nome] = { squadre, partite: [] };
    torneo.classificaGironiFinali[nome] = squadre.map(sq => ({
      squadra: sq, punti: 0, giocate: 0, vinte: 0, pareggi: 0, perse: 0, gf: 0, gs: 0, dr: 0
    }));
    // Crea partite (tutti contro tutti, gara unica)
    let idP = 0;
    for (let j = 0; j < 4; j++) {
      for (let k = j + 1; k < 4; k++) {
        torneo.gironiFinali[nome].partite.push({
          id: 'gf_' + nome + '_' + (idP++),
          casa: squadre[j],
          trasferta: squadre[k],
          golCasa: null, golTrasferta: null,
          played: false
        });
      }
    }
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function render() {
  const content = document.getElementById('content');
  if (torneo.fase === 'scelta') renderScelta(content);
  else if (torneo.fase === 'fine') renderFine(content);
  else renderTorneo(content);
}

function renderScelta(content) {
  let html = `<div class="fase-titolo">Scegli la tua squadra</div>
    <div class="avviso">Seleziona una nazionale per iniziare le qualificazioni agli Europei 2028.</div>
    <div class="avviso ospitanti">🏟️ Nazioni ospitanti: <strong>Inghilterra, Irlanda, Scozia, Galles</strong> — hanno 2 posti riservati se non si qualificano direttamente.</div>
    <div class="squadre-grid">`;
  Object.keys(SQUADRE).forEach(id => {
    const isHost = OSPITANTI.includes(id);
    html += `<div class="squadra-btn ${id === torneo.squadraScelta ? 'selezionata' : ''}" onclick="selezionaSquadra('${id}')">
      <div class="maglia">${creaGiocatoreSVG(SQUADRE[id].casa, 'fermo')}</div>
      <div>${SQUADRE[id].nome}${isHost ? ' 🏟️' : ''}</div>

      <button class="btn primario" onclick="iniziaQualificazioni()">INIZIA QUALIFICAZIONI</button>
    </div>`;
  }
  content.innerHTML = html;
}
function selezionaSquadra(id) { torneo.squadraScelta = id; render(); }
function iniziaQualificazioni() { inizializzaTorneo(torneo.squadraScelta); }

    </div>`;
  } else {

      <p style="font-size:12px">La tua squadra non ha partite in programma in questa fase.</p>
      <button class="play-big" onclick="simulaAvanti()">SIMULA AVANTI</button>
    </div>`;
  }

  // Fase qualificazioni
  if (torneo.fase === 'qualificazioni') {
    html += `<div class="fase-titolo">📋 Fase a Gironi — Qualificazioni</div>`;
    html += renderGironiQualificazione(tua);
  }

  // Spareggi
  if (torneo.fase === 'spareggi') {
    html += `<div class="fase-titolo">⚔️ Spareggi — Scenario: <span style="color:#4dabf7">${torneo.scenario}</span></div>`;
    html += `<div class="scenario-box">
      <strong>Scenario:</strong> ${torneo.scenario === 'due-ospiti' ? '2 posti ospitanti usati → 2 percorsi da 4, gara unica' :
        torneo.scenario === 'un-ospite' ? '1 posto ospitante usato → 3 percorsi da 4, gara unica' :
        '0 posti ospitanti usati → 4 spareggi andata/ritorno'}
      <br><strong>Posti in palio:</strong> ${torneo.postiSpareggi}
    </div>`;
    html += renderSpareggi(tua);
  }

  // Gironi finali
  if (torneo.fase === 'gironi_finali') {
    html += `<div class="fase-titolo">🏆 Fase Finale — 6 gironi da 4</div>`;
    html += renderGironiFinali(tua);
  }

  // Tabellone
  if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    html += renderTabellone(tua);
  }

  content.innerHTML = html;
}

function renderGironiQualificazione(tua) {
  let html = `<div class="gironi-grid">`;
  for (const nome of GRUPPI_NOMI) {
    const cls = torneo.classifica[nome];
    if (!cls) continue;
    const isHostGirone = torneo.gironi[nome].some(s => OSPITANTI.includes(s));
    html += `<div class="girone"><h3>Girone ${nome}${isHostGirone ? ' 🏟️' : ''}</h3><table class="classifica">
      <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
    cls.forEach((t, idx) => {
      const isTua = t.squadra === tua ? 'tua' : '';
      const qual = idx < 2 ? 'qualificata' : (idx === 2 ? 'spareggio' : '');
      const host = OSPITANTI.includes(t.squadra);
      html += `<tr class="${isTua} ${qual}">
        <td>${SQUADRE[t.squadra].nome}${host ? ' 🏟️' : ''}</td>
        <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderSpareggi(tua) {
  let html = '';
  for (const percorso of torneo.spareggi) {
    html += `<div class="turno-box"><h3>Percorso ${percorso.id.toUpperCase()}</h3>`;
    for (const p of percorso.partite) {
      const isTua = (p.casa === tua || p.trasferta === tua) ? 'tua' : '';
      let score = 'Da giocare';
      if (p.played) score = `${p.golCasa}-${p.golTrasferta}`;
      const label = p.fase === 'finale' ? '🏆 Finale percorso' : (p.fase === 'semifinale' ? 'Semifinale' : 'Spareggio');
      html += `<div class="match-row ${isTua}">
        <span style="font-size:10px;color:#aaa">${label}</span>
        <span>${SQUADRE[p.casa].nome}</span>
        <span class="score">${score}</span>
        <span>${SQUADRE[p.trasferta].nome}</span>
      </div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderGironiFinali(tua) {
  let html = `<div class="gironi-grid">`;
  for (const nome of ['A','B','C','D','E','F']) {
    const cls = torneo.classificaGironiFinali[nome];
    if (!cls) continue;
    html += `<div class="girone"><h3>Girone ${nome}</h3><table class="classifica">
      <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
    cls.forEach((t, idx) => {
      const isTua = t.squadra === tua ? 'tua' : '';
      const qual = idx < 2 ? 'qualificata' : (idx === 2 ? 'spareggio' : '');
      html += `<tr class="${isTua} ${qual}">
        <td>${SQUADRE[t.squadra].nome}</td>
        <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderTabellone(tua) {
  let html = `<div class="fase-titolo">🏆 Fase Finale a Eliminazione</div>`;
  const turni = [
    { key: 'ottavi', nome: 'Ottavi di Finale' },
    { key: 'quarti', nome: 'Quarti di Finale' },
    { key: 'semifinali', nome: 'Semifinali' },
    { key: 'finale', nome: 'Finale' }
  ];
  turni.forEach(t => {
    const partite = torneo.tabellone[t.key];
    if (!partite || partite.length === 0) return;
    html += `<div class="turno-box"><h3>${t.nome}</h3>`;
    partite.forEach(p => {
      const isTua = (p.casa === tua || p.trasferta === tua) ? 'tua' : '';
      const score = p.played ? `${p.golCasa}-${p.golTrasferta}` : 'Da giocare';
      html += `<div class="match-row ${isTua}">
        <span>${SQUADRE[p.casa].nome}</span>
        <span class="score">${score}</span>
        <span>${SQUADRE[p.trasferta].nome}</span>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

function renderFine(content) {
  const finale = torneo.tabellone.finale[0];
  const vincitore = finale.vincitore;
  const tua = torneo.squadraScelta;
  const msg = vincitore === tua ? '🏆 HAI VINTO GLI EUROPEI 2028!' : `🏆 Campione: ${SQUADRE[vincitore].nome}`;
  content.innerHTML = `
    <div class="fase-titolo">🏆 Fine Torneo</div>
    <div class="turno-box" style="text-align:center">
      <h2 style="color:#ffd700;font-size:22px;margin:12px 0">${msg}</h2>
      <button class="btn primario" onclick="resetTorneo()" style="margin-top:16px">NUOVO TORNEO</button>
    </div>`;
}

/* =========================================================
   SIMULA AVANTI
   ========================================================= */
function simulaAvanti() {
  simulaAltrePartite();
  controllaFineFase();
  salvaStato();
  render();
}

/* =========================================================
   AVVIO
   ========================================================= */
if (!riceviRisultato()) {
  if (!caricaStato()) {
    torneo = {
      squadraScelta: null,
      fase: 'scelta',
      gironi: {}, partite: [], classifica: {},
      qualificateDirette: [], postiOspitanti: [], spareggi: [],
      scenario: null, gironiFinali: {}, classificaGironiFinali: {},
      tabellone: { ottavi: [], quarti: [], semifinali: [], finale: [] },
      prossimaPartita: null
    };
  }
}

// Dopo ricezione risultato, controlla se la fase è finita
if (torneo.fase !== 'scelta' && torneo.fase !== 'fine') {
  controllaFineFase();
  simulaAltrePartite();
  controllaFineFase();
  calcolaProssimaPartita();
}

render();
</script>
</body>
</html>
