<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Europei 2028</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0a0a15;
    color: #eee;
    overflow: hidden;
    user-select: none;
  }
  .app { display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .header {
    background: linear-gradient(135deg, #16213e, #0f3460);
    padding: 16px;
    text-align: center;
    border-bottom: 3px solid #ffd700;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 22px; color: #ffd700; letter-spacing: 2px; }
  .header p { font-size: 12px; color: #aaa; margin-top: 4px; }
  .content { padding: 16px; max-width: 1100px; margin: 0 auto; width: 100%; padding-bottom: 40px; }
  .fase-titolo {
    font-size: 16px; color: #ffd700; font-weight: bold;
    margin: 20px 0 10px; padding: 8px 12px;
    background: rgba(255,215,0,0.1); border-left: 4px solid #ffd700;
    border-radius: 4px;
  }
  .gironi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
  }
  .girone {
    background: #16213e; border: 2px solid #0f3460; border-radius: 10px;
    padding: 10px; overflow: hidden;
  }
  .girone h3 {
    color: #ffd700; font-size: 13px; text-align: center;
    margin-bottom: 8px; padding-bottom: 6px;
    border-bottom: 1px solid rgba(255,215,0,0.3);
  }
  .classifica { width: 100%; border-collapse: collapse; font-size: 11px; }
  .classifica th {
    color: #ffd700; font-size: 10px; padding: 4px 2px;
    text-align: center; border-bottom: 1px solid rgba(255,255,255,0.15);
  }
  .classifica td { padding: 3px 2px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .classifica td:first-child { text-align: left; font-weight: bold; }
  .classifica tr.tua { background: rgba(77,171,247,0.25); }
  .classifica tr.qualificata td:first-child { color: #4ade80; }
  .classifica tr.spareggio td:first-child { color: #fbbf24; }
  .squadre-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px; margin-top: 12px;
  }
  .squadra-btn {
    background: #0f3460; border: 2px solid #4dabf7; border-radius: 8px;
    padding: 8px; cursor: pointer; text-align: center; color: #fff;
    font-size: 11px; font-weight: bold; transition: all 0.2s;
  }
  .squadra-btn:hover { background: #4dabf7; color: #16213e; }
  .squadra-btn.selezionata { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .squadra-btn .maglia { width: 40px; height: 52px; margin: 0 auto 4px; }
  .squadra-btn .maglia svg { width: 100%; height: 100%; }
  .btn {
    background: #0f3460; color: #fff; border: 2px solid #4dabf7;
    padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: bold;
    cursor: pointer; margin: 4px;
  }
  .btn:hover { background: #4dabf7; color: #0f3460; }
  .btn.primario { background: #ffd700; color: #16213e; border-color: #ffd700; }
  .btn.primario:hover { background: #fff; }
  .turno-box {
    background: #16213e; border: 2px solid #ffd700; border-radius: 10px;
    padding: 12px; margin: 12px 0;
  }
  .turno-box h3 { color: #ffd700; font-size: 14px; margin-bottom: 8px; }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
  }
  .match-row.tua { background: rgba(77,171,247,0.2); border-radius: 4px; }
  .match-row .score { color: #ffd700; font-weight: bold; margin: 0 8px; }
  .torna-menu {
    position: fixed; top: 10px; left: 10px; z-index: 20;
    background: #0f3460; border: 2px solid #4dabf7; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
    font-size: 12px;
  }
  .torna-menu:hover { background: #4dabf7; color: #0f3460; }
  .avviso {
    background: rgba(255,215,0,0.15); border: 1px solid #ffd700;
    border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #ffd700;
    margin: 10px 0;
  }
  .avviso.ospitanti {
    background: rgba(77,171,247,0.15); border-color: #4dabf7; color: #4dabf7;
  }
  .loading {
    text-align: center; padding: 40px; color: #ffd700; font-size: 14px;
  }
  .loading .spinner {
    display: inline-block; width: 40px; height: 40px;
    border: 4px solid rgba(255,215,0,0.3); border-top-color: #ffd700;
    border-radius: 50%; animation: spin 1s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .prossima-partita {
    background: linear-gradient(135deg, #ffd700, #f59f00);
    border-radius: 10px; padding: 14px; margin: 14px 0;
    color: #16213e; text-align: center;
  }
  .prossima-partita h3 { font-size: 14px; margin-bottom: 8px; }
  .prossima-partita .vs { font-size: 20px; font-weight: 900; margin: 8px 0; letter-spacing: 2px; }
  .prossima-partita .info { font-size: 11px; margin-bottom: 8px; }
  .prossima-partita .play-big {
    background: #16213e; color: #ffd700; border: none;
    padding: 10px 24px; border-radius: 8px; font-weight: bold;
    font-size: 14px; cursor: pointer;
  }
  .prossima-partita .play-big:hover { background: #000; }
  .reset-btn {
    position: fixed; top: 10px; right: 10px; z-index: 20;
    background: #8B2020; border: 2px solid #ff6b6b; color: #fff;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold;
    font-size: 12px;
  }
  .reset-btn:hover { background: #ff6b6b; }
</style>
</head>
<body>
<button class="torna-menu" onclick="location.href='index.html'">← Menù</button>
<button class="reset-btn" onclick="resetTorneo()">🗑 Reset</button>
<div class="app">
  <div class="header">
    <h1>🏆 EUROPEI 2028</h1>
    <p>Qualificazioni · Spareggi · Fase Finale</p>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Caricamento...</div>
    </div>
  </div>
</div>

<script src="divise.js"></script>
<script>
const STORAGE_KEY = 'europei2028_v3';
const GRUPPI_NOMI = ['A','B','C','D','E','F','G','H','I','J','K','L'];
const OSPITANTI = ['inghilterra', 'irlanda', 'scozia', 'galles'];

// =============================================================
// STATO SEMPLICE
// =============================================================
let torneo = null;

function nuovoTorneo() {
  return {
    squadraScelta: null,
    fase: 'scelta',
    gironi: {},
    // risultati: { 'gir_A_0_andata': [2,1], 'gir_A_0_ritorno': [0,0], ... }
    risultati: {},
    qualificate: [],
    ospitanti: [],
    scenario: null,
    spareggiVincitori: {},
    spareggiGiocati: {},
    gironiFinali: {},           // { A: [sq1, sq2, sq3, sq4], ... }
    risultatiGironiFinali: {},  // { 'gf_A_0': [1,0], ... }
    tabellone: {},              // { ottavi: [{casa, trasferta}, ...], ... }
    risultatiTabellone: {},     // { 'ottavi_0': [2,1], ... }
    prossimaPartita: null
  };
}

// =============================================================
// STORAGE
// =============================================================
function salvaStato() {
  if (!torneo) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(torneo));
  } catch (e) {
    console.warn('Quota superata, salvo solo il minimo');
    try {
      const minimo = {
        squadraScelta: torneo.squadraScelta,
        fase: torneo.fase,
        gironi: torneo.gironi,
        risultati: torneo.risultati || {}
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(minimo));
    } catch (e2) {
      console.error('Salvataggio impossibile', e2);
    }
  }
}

function caricaStato() {
  const salvato = localStorage.getItem(STORAGE_KEY);
  if (!salvato) return null;
  try {
    const s = JSON.parse(salvato);
    if (!s || !s.squadraScelta || !s.fase || !s.gironi) return null;
    // Verifica integrità
    for (const nome of Object.keys(s.gironi)) {
      if (!Array.isArray(s.gironi[nome])) return null;
      for (const sq of s.gironi[nome]) {
        if (!SQUADRE[sq]) return null;
      }
    }
    return s;
  } catch (e) {
    return null;
  }
}

function resetTorneo() {
  if (confirm('Reset torneo? Perderai tutti i progressi.')) {
    localStorage.removeItem(STORAGE_KEY);
    location.href = 'europei2028.html';
  }
}

// =============================================================
// GENERAZIONE GIRONI E PARTITE
// =============================================================
function creaGironi() {
  const ids = Object.keys(SQUADRE);
  const ospitanti = ids.filter(id => OSPITANTI.includes(id));
  const altri = ids.filter(id => !OSPITANTI.includes(id));
  const oS = [...ospitanti].sort(() => Math.random() - 0.5);
  const aS = [...altri].sort(() => Math.random() - 0.5);
  const gironi = {};
  let k = 0;
  // A,B,C,D: 1 ospitante + 4 altri
  for (let i = 0; i < 4; i++) {
    gironi[GRUPPI_NOMI[i]] = [oS[i]];
    for (let j = 0; j < 4; j++) gironi[GRUPPI_NOMI[i]].push(aS[k++]);
  }
  // E,F: 5 altri
  for (let i = 4; i < 6; i++) {
    gironi[GRUPPI_NOMI[i]] = [];
    for (let j = 0; j < 5; j++) gironi[GRUPPI_NOMI[i]].push(aS[k++]);
  }
  // G-L: 4 altri
  for (let i = 6; i < 12; i++) {
    gironi[GRUPPI_NOMI[i]] = [];
    for (let j = 0; j < 4; j++) gironi[GRUPPI_NOMI[i]].push(aS[k++]);
  }
  return gironi;
}

function creaPartiteGirone(gironi) {
  const partite = [];
  let idP = 0;
  for (const nome of GRUPPI_NOMI) {
    const squadre = gironi[nome] || [];
    for (let i = 0; i < squadre.length; i++) {
      for (let j = i + 1; j < squadre.length; j++) {
        const casa = Math.random() < 0.5 ? squadre[i] : squadre[j];
        const trasf = casa === squadre[i] ? squadre[j] : squadre[i];
        partite.push({
          id: 'gir_' + nome + '_' + (idP++),
          girone: nome,
          andata: { casa, trasferta: trasf },
          ritorno: { casa: trasf, trasferta: casa }
        });
      }
    }
  }
  return partite;
}

function inizializzaTorneo(squadraScelta) {
  torneo = nuovoTorneo();
  torneo.squadraScelta = squadraScelta;
  torneo.fase = 'qualificazioni';
  torneo.gironi = creaGironi();
  torneo.partite = creaPartiteGirone(torneo.gironi);
  salvaStato();
  calcolaProssimaPartita();
  render();
}

// =============================================================
// CLASSIFICHE (ricostruite)
// =============================================================
function getClassifica(nomeGirone) {
  const squadre = torneo.gironi[nomeGirone] || [];
  const tab = {};
  squadre.forEach(sq => tab[sq] = { squadra: sq, punti: 0, giocate: 0, vinte: 0, pareggi: 0, perse: 0, gf: 0, gs: 0, dr: 0 });
  const partite = creaPartiteGirone(torneo.gironi).filter(p => p.girone === nomeGirone);
  for (const p of partite) {
    for (const sotto of ['andata', 'ritorno']) {
      const key = p.id + '_' + sotto;
      const r = torneo.risultati[key];
      if (!r) continue;
      const casa = p[sotto].casa;
      const trasf = p[sotto].trasferta;
      const [gc, gt] = r;
      const c = tab[casa], t = tab[trasf];
      if (!c || !t) continue;
      c.giocate++; t.giocate++;
      c.gf += gc; c.gs += gt;
      t.gf += gt; t.gs += gc;
      if (gc > gt) { c.punti += 3; c.vinte++; t.perse++; }
      else if (gc < gt) { t.punti += 3; t.vinte++; c.perse++; }
      else { c.punti++; t.punti++; c.pareggi++; t.pareggi++; }
      c.dr = c.gf - c.gs;
      t.dr = t.gf - t.gs;
    }
  }
  const arr = Object.values(tab).sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
  return arr;
}

function getClassificaFinale(nomeGirone) {
  const squadre = torneo.gironiFinali[nomeGirone] || [];
  const tab = {};
  squadre.forEach(sq => tab[sq] = { squadra: sq, punti: 0, giocate: 0, vinte: 0, pareggi: 0, perse: 0, gf: 0, gs: 0, dr: 0 });
  for (let i = 0; i < squadre.length; i++) {
    for (let j = i + 1; j < squadre.length; j++) {
      const key = 'gf_' + nomeGirone + '_' + i + '_' + j;
      const r = torneo.risultatiGironiFinali[key];
      if (!r) continue;
      const [gc, gt] = r;
      const casa = squadre[i], trasf = squadre[j];
      const c = tab[casa], t = tab[trasf];
      c.giocate++; t.giocate++;
      c.gf += gc; c.gs += gt;
      t.gf += gt; t.gs += gc;
      if (gc > gt) { c.punti += 3; c.vinte++; t.perse++; }
      else if (gc < gt) { t.punti += 3; t.vinte++; c.perse++; }
      else { c.punti++; t.punti++; c.pareggi++; t.pareggi++; }
      c.dr = c.gf - c.gs;
      t.dr = t.gf - t.gs;
    }
  }
  return Object.values(tab).sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
}

// =============================================================
// PROSSIMA PARTITA
// =============================================================
function calcolaProssimaPartita() {
  torneo.prossimaPartita = null;
  if (!torneo.squadraScelta) return;
  const tua = torneo.squadraScelta;

  if (torneo.fase === 'qualificazioni') {
    const partite = creaPartiteGirone(torneo.gironi);
    for (const p of partite) {
      for (const sotto of ['andata', 'ritorno']) {
        if (torneo.risultati[p.id + '_' + sotto]) continue;
        if (p[sotto].casa === tua || p[sotto].trasferta === tua) {
          torneo.prossimaPartita = {
            tipo: 'girone', id: p.id, sotto,
            casa: p[sotto].casa, trasferta: p[sotto].trasferta,
            girone: p.girone
          };
          return;
        }
      }
    }
  } else if (torneo.fase === 'spareggi') {
    for (const [id, dati] of Object.entries(torneo.spareggiPartite || {})) {
      if (torneo.spareggiGiocati[id]) continue;
      if (dati.casa === tua || dati.trasferta === tua) {
        torneo.prossimaPartita = {
          tipo: 'spareggio', id, sotto: 'unica',
          casa: dati.casa, trasferta: dati.trasferta
        };
        return;
      }
    }
  } else if (torneo.fase === 'gironi_finali') {
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const squadre = torneo.gironiFinali[nome];
      for (let i = 0; i < squadre.length; i++) {
        for (let j = i + 1; j < squadre.length; j++) {
          const key = 'gf_' + nome + '_' + i + '_' + j;
          if (torneo.risultatiGironiFinali[key]) continue;
          if (squadre[i] === tua || squadre[j] === tua) {
            torneo.prossimaPartita = {
              tipo: 'girone_finale', id: key, sotto: 'unica',
              casa: squadre[i], trasferta: squadre[j],
              girone: nome
            };
            return;
          }
        }
      }
    }
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase] || [];
    turno.forEach((p, i) => {
      if (torneo.prossimaPartita) return;
      const key = torneo.fase + '_' + i;
      if (torneo.risultatiTabellone[key]) return;
      if (p.casa === tua || p.trasferta === tua) {
        torneo.prossimaPartita = {
          tipo: torneo.fase, id: key, sotto: 'unica',
          casa: p.casa, trasferta: p.trasferta
        };
      }
    });
  }
}

// =============================================================
// SIMULAZIONE
// =============================================================
const FORZA = {
  italia: 90, francia: 92, germania: 88, spagna: 91, portogallo: 87,
  inghilterra: 89, olanda: 85, belgio: 84, croazia: 83, danimarca: 82,
  svizzera: 80, austria: 79, polonia: 78, ucraina: 77, turchia: 76,
  svezia: 75, norvegia: 74, scozia: 73, galles: 72, irlanda: 71,
  serbia: 70, ungheria: 69, romania: 68, grecia: 67, cechia: 66,
  slovacchia: 65, slovenia: 64, finlandia: 63, islanda: 62, albania: 61,
  bosnia: 60, macedonia: 59, montenegro: 58, bulgaria: 57, bielorussia: 56,
  georgia: 55, armenia: 54, azerbaigian: 53, kazakistan: 52, cipro: 51,
  malta: 50, lussemburgo: 49, estonia: 48, lettonia: 47, lituania: 46,
  moldavia: 45, kosovo: 44, faroe: 43, andorra: 42, sanmarino: 41,
  gibilterra: 40, liechtenstein: 39, russia: 80
};
function forza(id) { return FORZA[id] || 50; }

function simula(a, b) {
  const fa = forza(a), fb = forza(b);
  const pa = fa / (fa + fb);
  const ga = Math.random() < pa ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  const gb = Math.random() < (1 - pa) ? Math.floor(Math.random() * 4) : Math.floor(Math.random() * 2);
  return [ga, gb];
}

function simulaTutteLeAltre() {
  const tua = torneo.squadraScelta;
  if (torneo.fase === 'qualificazioni') {
    const partite = creaPartiteGirone(torneo.gironi);
    for (const p of partite) {
      for (const sotto of ['andata', 'ritorno']) {
        const key = p.id + '_' + sotto;
        if (torneo.risultati[key]) continue;
        if (p[sotto].casa === tua || p[sotto].trasferta === tua) continue;
        torneo.risultati[key] = simula(p[sotto].casa, p[sotto].trasferta);
      }
    }
  } else if (torneo.fase === 'spareggi') {
    for (const [id, dati] of Object.entries(torneo.spareggiPartite || {})) {
      if (torneo.spareggiGiocati[id]) continue;
      if (dati.casa === tua || dati.trasferta === tua) continue;
      const [gc, gt] = simula(dati.casa, dati.trasferta);
      torneo.spareggiGiocati[id] = [gc, gt];
      torneo.spareggiVincitori[id] = gc > gt ? dati.casa : (gt > gc ? dati.trasferta : (Math.random() < 0.5 ? dati.casa : dati.trasferta));
    }
  } else if (torneo.fase === 'gironi_finali') {
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const squadre = torneo.gironiFinali[nome];
      for (let i = 0; i < squadre.length; i++) {
        for (let j = i + 1; j < squadre.length; j++) {
          const key = 'gf_' + nome + '_' + i + '_' + j;
          if (torneo.risultatiGironiFinali[key]) continue;
          if (squadre[i] === tua || squadre[j] === tua) continue;
          torneo.risultatiGironiFinali[key] = simula(squadre[i], squadre[j]);
        }
      }
    }
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase] || [];
    turno.forEach((p, i) => {
      const key = torneo.fase + '_' + i;
      if (torneo.risultatiTabellone[key]) return;
      if (p.casa === tua || p.trasferta === tua) return;
      torneo.risultatiTabellone[key] = simula(p.casa, p.trasferta);
    });
  }
}

// =============================================================
// AVANZAMENTO FASI
// =============================================================
function controllaAvanzamento() {
  const tua = torneo.squadraScelta;

  if (torneo.fase === 'qualificazioni') {
    // Tutte giocate?
    const partite = creaPartiteGirone(torneo.gironi);
    const tutte = partite.every(p => torneo.risultati[p.id + '_andata'] && torneo.risultati[p.id + '_ritorno']);
    if (!tutte) return;

    // Calcola qualificate: prime 2 di ogni girone (24)
    const vincitrici = [], seconde = [], terze = [];
    for (const nome of GRUPPI_NOMI) {
      const cls = getClassifica(nome);
      if (cls[0]) vincitrici.push(cls[0].squadra);
      if (cls[1]) seconde.push({ sq: cls[1].squadra, p: cls[1].punti, dr: cls[1].dr, gf: cls[1].gf });
      if (cls[2]) terze.push({ sq: cls[2].squadra, p: cls[2].punti, dr: cls[2].dr, gf: cls[2].gf });
    }
    seconde.sort((a, b) => b.p - a.p || b.dr - a.dr || b.gf - a.gf);
    terze.sort((a, b) => b.p - a.p || b.dr - a.dr || b.gf - a.gf);
    const miglioriSeconde = seconde.slice(0, 8).map(s => s.sq);
    torneo.qualificate = [...vincitrici, ...miglioriSeconde];

    // Ospitanti non qualificate
    const ospNonQ = OSPITANTI.filter(o => !torneo.qualificate.includes(o));
    // Rank ospitanti in base alla posizione nel girone
    function posInGirone(id) {
      for (const nome of GRUPPI_NOMI) {
        const idx = (torneo.gironi[nome] || []).indexOf(id);
        if (idx >= 0) {
          const cls = getClassifica(nome);
          const pos = cls.findIndex(x => x.squadra === id);
          return { pos, punti: cls[pos]?.punti || 0, dr: cls[pos]?.dr || 0, gf: cls[pos]?.gf || 0 };
        }
      }
      return { pos: 99, punti: 0, dr: 0, gf: 0 };
    }
    ospNonQ.sort((a, b) => {
      const A = posInGirone(a), B = posInGirone(b);
      return A.pos - B.pos || B.punti - A.punti || B.dr - A.dr || B.gf - A.gf;
    });
    torneo.ospitanti = ospNonQ.slice(0, 2);

    // Scenario
    torneo.scenario = torneo.ospitanti.length === 2 ? 'due-ospiti' :
                      torneo.ospitanti.length === 1 ? 'un-ospite' : 'zero-ospiti';

    // Disponibili per spareggi
    const secondeNonQ = seconde.slice(8).map(s => s.sq);
    const terzeNonQ = terze.map(t => t.sq);
    const disponibili = [...secondeNonQ, ...terzeNonQ];

    // Crea spareggi
    torneo.spareggiPartite = {};
    let percorsi;
    if (torneo.scenario === 'due-ospiti') percorsi = 2;
    else if (torneo.scenario === 'un-ospite') percorsi = 3;
    else percorsi = 4;

    const daUsare = torneo.scenario === 'due-ospiti' ? 8 :
                    torneo.scenario === 'un-ospite' ? 12 : 8;
    const scelte = disponibili.slice(0, daUsare);
    const mesc = [...scelte].sort(() => Math.random() - 0.5);
    const perPercorso = mesc.length / percorsi;
    for (let i = 0; i < percorsi; i++) {
      const gruppo = mesc.slice(i * perPercorso, (i + 1) * perPercorso);
      if (torneo.scenario === 'zero-ospiti') {
        // andata/ritorno: 2 squadre per percorso
        torneo.spareggiPartite['spareggio_p' + i + '_0'] = { casa: gruppo[0], trasferta: gruppo[1], percorso: i };
      } else {
        // semifinale + finale: 4 squadre per percorso
        torneo.spareggiPartite['spareggio_p' + i + '_s0'] = { casa: gruppo[0], trasferta: gruppo[1], percorso: i, fase: 'semifinale' };
        torneo.spareggiPartite['spareggio_p' + i + '_s1'] = { casa: gruppo[2], trasferta: gruppo[3], percorso: i, fase: 'semifinale' };
      }
    }
    torneo.fase = 'spareggi';
    salvaStato();
    calcolaProssimaPartita();
    return;
  }

  if (torneo.fase === 'spareggi') {
    // Verifica se tutte le partite sono giocate
    const ids = Object.keys(torneo.spareggiPartite || {});
    const tutte = ids.every(id => torneo.spareggiGiocati[id]);

    // Se semifinali giocate, crea finali
    if (torneo.scenario !== 'zero-ospiti') {
      for (let i = 0; i < (torneo.scenario === 'due-ospiti' ? 2 : 3); i++) {
        const s0 = 'spareggio_p' + i + '_s0';
        const s1 = 'spareggio_p' + i + '_s1';
        const f = 'spareggio_p' + i + '_f';
        if (torneo.spareggiVincitori[s0] && torneo.spareggiVincitori[s1] && !torneo.spareggiPartite[f]) {
          torneo.spareggiPartite[f] = {
            casa: torneo.spareggiVincitori[s0],
            trasferta: torneo.spareggiVincitori[s1],
            percorso: i, fase: 'finale'
          };
          salvaStato();
          calcolaProssimaPartita();
          return;
        }
      }
    }

    // Controlla di nuovo
    const ids2 = Object.keys(torneo.spareggiPartite || {});
    const tutte2 = ids2.every(id => torneo.spareggiGiocati[id]);
    if (!tutte2) return;

    // Tutti gli spareggi completati: raccogli vincitori
    const vincitoriSpareggi = [];
    for (let i = 0; i < (torneo.scenario === 'due-ospiti' ? 2 : torneo.scenario === 'un-ospite' ? 3 : 4); i++) {
      if (torneo.scenario === 'zero-ospiti') {
        const v = torneo.spareggiVincitori['spareggio_p' + i + '_0'];
        if (v) vincitoriSpareggi.push(v);
      } else {
        const v = torneo.spareggiVincitori['spareggio_p' + i + '_f'];
        if (v) vincitoriSpareggi.push(v);
      }
    }

    // Qualificate finali = qualificate + ospitanti + vincitori spareggi
    const qualificateFinali = [...torneo.qualificate, ...torneo.ospitanti, ...vincitoriSpareggi];
    // Prendi le prime 24
    const finali = qualificateFinali.slice(0, 24);

    // Crea 6 gironi da 4
    const mesc = [...finali].sort(() => Math.random() - 0.5);
    torneo.gironiFinali = {};
    for (let i = 0; i < 6; i++) {
      torneo.gironiFinali[String.fromCharCode(65 + i)] = mesc.slice(i * 4, (i + 1) * 4);
    }
    torneo.risultatiGironiFinali = {};
    torneo.fase = 'gironi_finali';
    salvaStato();
    calcolaProssimaPartita();
    return;
  }

  if (torneo.fase === 'gironi_finali') {
    // Verifica se tutti i gironi finali sono completati
    let tutte = true;
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const squadre = torneo.gironiFinali[nome];
      for (let i = 0; i < squadre.length; i++) {
        for (let j = i + 1; j < squadre.length; j++) {
          const key = 'gf_' + nome + '_' + i + '_' + j;
          if (!torneo.risultatiGironiFinali[key]) { tutte = false; break; }
        }
        if (!tutte) break;
      }
      if (!tutte) break;
    }
    if (!tutte) return;

    // Qualificate: prime 2 di ogni girone (12) + 4 migliori terze
    const primeDue = [], terze = [];
    for (const nome of Object.keys(torneo.gironiFinali)) {
      const cls = getClassificaFinale(nome);
      if (cls[0]) primeDue.push(cls[0].squadra);
      if (cls[1]) primeDue.push(cls[1].squadra);
      if (cls[2]) terze.push(cls[2]);
    }
    terze.sort((a, b) => b.punti - a.punti || b.dr - a.dr || b.gf - a.gf);
    const migliori = terze.slice(0, 4).map(t => t.squadra);
    const sedici = [...primeDue, ...migliori];

    // Crea ottavi
    const mesc = [...sedici].sort(() => Math.random() - 0.5);
    torneo.tabellone = { ottavi: [], quarti: [], semifinali: [], finale: [] };
    torneo.risultatiTabellone = {};
    for (let i = 0; i < 8; i++) {
      torneo.tabellone.ottavi.push({ casa: mesc[i * 2], trasferta: mesc[i * 2 + 1] });
    }
    torneo.fase = 'ottavi';
    salvaStato();
    calcolaProssimaPartita();
    return;
  }

  if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    const turno = torneo.tabellone[torneo.fase] || [];
    const tutte = turno.every((p, i) => torneo.risultatiTabellone[torneo.fase + '_' + i]);
    if (!tutte) return;

    // Calcola vincitori
    const vincitori = turno.map((p, i) => {
      const [gc, gt] = torneo.risultatiTabellone[torneo.fase + '_' + i];
      if (gc > gt) return p.casa;
      if (gt > gc) return p.trasferta;
      return Math.random() < 0.5 ? p.casa : p.trasferta;
    });

    if (torneo.fase === 'finale') {
      torneo.fase = 'fine';
      torneo.vincitoreFinale = vincitori[0];
      salvaStato();
      return;
    }

    // Turno successivo
    const prossimo = torneo.fase === 'ottavi' ? 'quarti' :
                     torneo.fase === 'quarti' ? 'semifinali' : 'finale';
    torneo.tabellone[prossimo] = [];
    for (let i = 0; i < vincitori.length; i += 2) {
      torneo.tabellone[prossimo].push({ casa: vincitori[i], trasferta: vincitori[i + 1] });
    }
    torneo.fase = prossimo;
    salvaStato();
    calcolaProssimaPartita();
  }
}

// =============================================================
// GIOCO
// =============================================================
function giocaPartita(id, sotto, casa, trasferta) {
  const dati = {
    sqTU: casa === torneo.squadraScelta ? casa : trasferta,
    sqCPU: casa === torneo.squadraScelta ? trasferta : casa,
    idPartita: id, sotto,
    casaOriginale: casa,
    trasfertaOriginale: trasferta
  };
  const chiave = id + '_' + sotto;
  localStorage.setItem('torneo_partita_attiva_' + chiave, JSON.stringify(dati));
  location.href = 'index.html?torneo=europei&partita=' + encodeURIComponent(chiave);
}

function riceviRisultato() {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('risultato');
  if (!id) return false;
  if (!torneo) return false;
  const key = 'torneo_partita_' + id;
  const json = localStorage.getItem(key);
  if (!json) return false;
  const risultato = JSON.parse(json);
  localStorage.removeItem(key);

  const dati = JSON.parse(localStorage.getItem('torneo_partita_attiva_' + id) || '{}');
  if (!dati.casaOriginale) return false;

  const sqTU = dati.sqTU;
  const golTU = risultato.golTU;
  const golCPU = risultato.golCPU;
  const casa = dati.casaOriginale;
  const trasferta = dati.trasfertaOriginale;
  const golCasa = casa === sqTU ? golTU : golCPU;
  const golTrasferta = casa === sqTU ? golCPU : golTU;

  const parti = id.split('_');
  if (parti[0] === 'gir') {
    // gir_A_0_andata
    const idPartita = 'gir_' + parti[1] + '_' + parti[2];
    const sotto = parti[3];
    torneo.risultati[idPartita + '_' + sotto] = [golCasa, golTrasferta];
  } else if (parti[0] === 'spareggio') {
    // spareggio_p0_s0
    const idPartita = parti.slice(0, 3).join('_');
    torneo.spareggiGiocati[idPartita] = [golCasa, golTrasferta];
    torneo.spareggiVincitori[idPartita] = golCasa > golTrasferta ? casa : (golTrasferta > golCasa ? trasferta : (Math.random() < 0.5 ? casa : trasferta));
  } else if (parti[0] === 'gf') {
    // gf_A_0_0
    const idPartita = parti.slice(0, 4).join('_');
    torneo.risultatiGironiFinali[idPartita] = [golCasa, golTrasferta];
  } else {
    // ottavi_0, quarti_0, ...
    const idPartita = parti[0] + '_' + parti[1];
    torneo.risultatiTabellone[idPartita] = [golCasa, golTrasferta];
  }

  window.history.replaceState({}, document.title, 'europei2028.html');
  salvaStato();
  return true;
}

// =============================================================
// RENDER
// =============================================================
function render() {
  const content = document.getElementById('content');
  if (!torneo || torneo.fase === 'scelta') return renderScelta(content);
  if (torneo.fase === 'fine') return renderFine(content);
  return renderTorneo(content);
}

function renderScelta(content) {
  let html = `<div class="fase-titolo">Scegli la tua squadra</div>
    <div class="avviso">Seleziona una nazionale per iniziare le qualificazioni agli Europei 2028.</div>
    <div class="avviso ospitanti">🏟️ Ospitanti: <strong>Inghilterra, Irlanda, Scozia, Galles</strong> — 2 posti riservati.</div>
    <div class="squadre-grid">`;
  Object.keys(SQUADRE).forEach(id => {
    const sq = SQUADRE[id];
    if (!sq) return;
    const isHost = OSPITANTI.includes(id);
    html += `<div class="squadra-btn ${torneo && id === torneo.squadraScelta ? 'selezionata' : ''}" onclick="selezionaSquadra('${id}')">
      <div class="maglia">${creaGiocatoreSVG(sq.casa, 'fermo')}</div>
      <div>${sq.nome}${isHost ? ' 🏟️' : ''}</div>
    </div>`;
  });
  html += `</div>`;
  if (torneo && torneo.squadraScelta) {
    html += `<div style="text-align:center;margin-top:16px">
      <button class="btn primario" onclick="iniziaQualificazioni()">INIZIA QUALIFICAZIONI</button>
    </div>`;
  }
  content.innerHTML = html;
}

function selezionaSquadra(id) {
  if (!torneo) torneo = nuovoTorneo();
  torneo.squadraScelta = id;
  render();
}
function iniziaQualificazioni() { inizializzaTorneo(torneo.squadraScelta); }

function renderTorneo(content) {
  const tua = torneo.squadraScelta;
  if (!SQUADRE[tua]) { location.reload(); return; }
  let html = `<div class="avviso">Squadra: <strong>${SQUADRE[tua].nome}</strong> · Fase: <strong>${torneo.fase.toUpperCase()}</strong></div>`;

  // Prossima partita
  if (torneo.prossimaPartita) {
    const pp = torneo.prossimaPartita;
    const nomeCasa = SQUADRE[pp.casa] ? SQUADRE[pp.casa].nome : pp.casa;
    const nomeTrasf = SQUADRE[pp.trasferta] ? SQUADRE[pp.trasferta].nome : pp.trasferta;
    html += `<div class="prossima-partita">
      <h3>⚽ PROSSIMA PARTITA</h3>
      <div class="vs">${nomeCasa} vs ${nomeTrasf}</div>
      <div class="info">${pp.sotto === 'andata' ? 'Andata' : pp.sotto === 'ritorno' ? 'Ritorno' : 'Gara unica'}</div>
      <button class="play-big" onclick="giocaPartita('${pp.id}', '${pp.sotto}', '${pp.casa}', '${pp.trasferta}')">▶ GIOCA</button>
    </div>`;
  } else {
    html += `<div class="prossima-partita" style="background:#16213e;color:#ffd700">
      <h3>⏳ In attesa</h3>
      <button class="play-big" onclick="simulaAvanti()">SIMULA AVANTI</button>
    </div>`;
  }

  if (torneo.fase === 'qualificazioni') {
    html += `<div class="fase-titolo">📋 Qualificazioni</div>`;
    html += renderGironiQualificazione(tua);
  } else if (torneo.fase === 'spareggi') {
    html += `<div class="fase-titolo">⚔️ Spareggi (${torneo.scenario})</div>`;
    html += renderSpareggi(tua);
  } else if (torneo.fase === 'gironi_finali') {
    html += `<div class="fase-titolo">🏆 Fase Finale</div>`;
    html += renderGironiFinali(tua);
  } else if (['ottavi','quarti','semifinali','finale'].includes(torneo.fase)) {
    html += renderTabellone(tua);
  }

  content.innerHTML = html;
}

function renderGironiQualificazione(tua) {
  let html = `<div class="gironi-grid">`;
  for (const nome of GRUPPI_NOMI) {
    const cls = getClassifica(nome);
    if (!cls || cls.length === 0) continue;
    const hostGirone = (torneo.gironi[nome] || []).some(s => OSPITANTI.includes(s));
    html += `<div class="girone"><h3>Girone ${nome}${hostGirone ? ' 🏟️' : ''}</h3><table class="classifica">
      <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
    cls.forEach((t, idx) => {
      const sqInfo = SQUADRE[t.squadra];
      const nomeSq = sqInfo ? sqInfo.nome : t.squadra;
      const isTua = t.squadra === tua ? 'tua' : '';
      const qual = idx < 2 ? 'qualificata' : (idx === 2 ? 'spareggio' : '');
      const host = OSPITANTI.includes(t.squadra) ? ' 🏟️' : '';
      html += `<tr class="${isTua} ${qual}">
        <td>${nomeSq}${host}</td>
        <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderSpareggi(tua) {
  let html = '';
  const percorsi = torneo.scenario === 'due-ospiti' ? 2 :
                   torneo.scenario === 'un-ospite' ? 3 : 4;
  for (let i = 0; i < percorsi; i++) {
    html += `<div class="turno-box"><h3>Percorso ${i + 1}</h3>`;
    const ids = Object.keys(torneo.spareggiPartite || {}).filter(id => torneo.spareggiPartite[id].percorso === i);
    for (const id of ids) {
      const p = torneo.spareggiPartite[id];
      const nomeCasa = SQUADRE[p.casa] ? SQUADRE[p.casa].nome : p.casa;
      const nomeTrasf = SQUADRE[p.trasferta] ? SQUADRE[p.trasferta].nome : p.trasferta;
      const r = torneo.spareggiGiocati[id];
      const score = r ? `${r[0]}-${r[1]}` : 'Da giocare';
      const isTua = (p.casa === tua || p.trasferta === tua) ? 'tua' : '';
      const label = p.fase === 'finale' ? '🏆 Finale percorso' : (p.fase === 'semifinale' ? 'Semifinale' : 'Spareggio');
      html += `<div class="match-row ${isTua}">
        <span style="font-size:10px;color:#aaa">${label}</span>
        <span>${nomeCasa}</span>
        <span class="score">${score}</span>
        <span>${nomeTrasf}</span>
      </div>`;
    }
    html += `</div>`;
  }
  return html;
}

function renderGironiFinali(tua) {
  let html = `<div class="gironi-grid">`;
  for (const nome of Object.keys(torneo.gironiFinali)) {
    const cls = getClassificaFinale(nome);
    if (!cls || cls.length === 0) continue;
    html += `<div class="girone"><h3>Girone ${nome}</h3><table class="classifica">
      <tr><th>Squadra</th><th>Pt</th><th>G</th><th>GF</th><th>GS</th><th>DR</th></tr>`;
    cls.forEach((t, idx) => {
      const sqInfo = SQUADRE[t.squadra];
      const nomeSq = sqInfo ? sqInfo.nome : t.squadra;
      const isTua = t.squadra === tua ? 'tua' : '';
      const qual = idx < 2 ? 'qualificata' : (idx === 2 ? 'spareggio' : '');
      html += `<tr class="${isTua} ${qual}">
        <td>${nomeSq}</td>
        <td>${t.punti}</td><td>${t.giocate}</td><td>${t.gf}</td><td>${t.gs}</td><td>${t.dr > 0 ? '+' : ''}${t.dr}</td>
      </tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderTabellone(tua) {
  let html = `<div class="fase-titolo">🏆 Fase a Eliminazione</div>`;
  for (const turno of ['ottavi','quarti','semifinali','finale']) {
    const partite = torneo.tabellone[turno] || [];
    if (partite.length === 0) continue;
    html += `<div class="turno-box"><h3>${turno.charAt(0).toUpperCase() + turno.slice(1)}</h3>`;
    partite.forEach((p, i) => {
      const key = turno + '_' + i;
      const r = torneo.risultatiTabellone[key];
      const score = r ? `${r[0]}-${r[1]}` : 'Da giocare';
      const nomeCasa = SQUADRE[p.casa] ? SQUADRE[p.casa].nome : p.casa;
      const nomeTrasf = SQUADRE[p.trasferta] ? SQUADRE[p.trasferta].nome : p.trasferta;
      const isTua = (p.casa === tua || p.trasferta === tua) ? 'tua' : '';
      html += `<div class="match-row ${isTua}">
        <span>${nomeCasa}</span>
        <span class="score">${score}</span>
        <span>${nomeTrasf}</span>
      </div>`;
    });
    html += `</div>`;
  }
  return html;
}

function renderFine(content) {
  const vincitore = torneo.vincitoreFinale;
  const tua = torneo.squadraScelta;
  const msg = vincitore === tua ? '🏆 HAI VINTO GLI EUROPEI 2028!' :
    `🏆 Campione: ${SQUADRE[vincitore] ? SQUADRE[vincitore].nome : vincitore}`;
  content.innerHTML = `
    <div class="fase-titolo">🏆 Fine Torneo</div>
    <div class="turno-box" style="text-align:center">
      <h2 style="color:#ffd700;font-size:22px;margin:12px 0">${msg}</h2>
      <button class="btn primario" onclick="resetTorneo()">NUOVO TORNEO</button>
    </div>`;
}

function simulaAvanti() {
  simulaTutteLeAltre();
  controllaAvanzamento();
  salvaStato();
  render();
}

// =============================================================
// AVVIO
// =============================================================
try {
  if (localStorage.getItem('europei2028_stato')) localStorage.removeItem('europei2028_stato');
  if (localStorage.getItem('europei2028_stato_v2')) localStorage.removeItem('europei2028_stato_v2');
} catch (e) {}

// 1) Carica PRIMA lo stato del torneo (necessario per riceviRisultato)
const salvato = caricaStato();
if (salvato) {
  torneo = salvato;
  // Assicurati che le proprietà opzionali esistano
  if (!torneo.spareggiPartite) torneo.spareggiPartite = {};
  if (!torneo.spareggiGiocati) torneo.spareggiGiocati = {};
  if (!torneo.spareggiVincitori) torneo.spareggiVincitori = {};
  if (!torneo.risultatiGironiFinali) torneo.risultatiGironiFinali = {};
  if (!torneo.risultatiTabellone) torneo.risultatiTabellone = {};
  if (!torneo.tabellone) torneo.tabellone = {};
} else {
  torneo = nuovoTorneo();
}

// 2) Ora puoi ricevere il risultato (torneo non è più null)
riceviRisultato();

if (torneo.fase && torneo.fase !== 'scelta' && torneo.fase !== 'fine') {
  simulaTutteLeAltre();
  controllaAvanzamento();
}

render();
</script>
